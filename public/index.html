<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>⚡ SOCCER BET | Handicap • Over/Under</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0a2a1f, #0b3b25); padding: 15px; padding-bottom: 100px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: rgba(0,0,0,0.7); border-radius: 28px; padding: 12px 16px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #FFD700; }
        .logo h1 { background: linear-gradient(135deg, #FFD700, #FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.2rem; }
        .user-menu { display: flex; align-items: center; gap: 8px; background: #0a1a1a; padding: 5px 12px; border-radius: 50px; border: 1px solid #FFD700; }
        .username { color: #FFD700; font-size: 0.8rem; }
        .balance-value { font-size: 1rem; font-weight: bold; color: #00FF88; }
        .menu-btn { background: #1a1a2e; border: 1px solid #FFD700; padding: 4px 12px; border-radius: 30px; color: #FFD700; cursor: pointer; font-size: 0.7rem; }
        .match-card { background: #0a1a1a; border-radius: 16px; padding: 12px; margin-bottom: 12px; border: 1px solid #FFD70030; }
        .match-header { display: flex; justify-content: space-between; margin-bottom: 10px; color: #FFD700; font-size: 0.7rem; }
        .match-teams { text-align: center; margin-bottom: 15px; }
        .team-name { font-weight: bold; color: white; font-size: 1rem; }
        .vs { color: #FFD700; margin: 5px 0; }
        .market-title { font-size: 0.7rem; color: #FFA500; margin: 10px 0 5px; font-weight: bold; }
        .bet-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .bet-btn { flex: 1; min-width: 70px; background: #0a0a10; border: 1px solid #FFD70040; border-radius: 12px; padding: 8px 4px; text-align: center; cursor: pointer; }
        .bet-btn:active { background: #FFD700; }
        .bet-label { font-size: 0.6rem; color: #FFD700; }
        .bet-value { font-size: 0.85rem; font-weight: bold; color: #00FF88; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0a1a1a; border-top: 2px solid #FFD700; padding: 12px; display: flex; gap: 10px; z-index: 1000; }
        .bottom-btn { flex: 1; background: #1a2a2a; border: 1px solid #FFD700; padding: 12px; border-radius: 50px; text-align: center; cursor: pointer; color: #FFD700; }
        .api-status { background: #1a2a2a; padding: 8px; border-radius: 20px; margin-bottom: 15px; text-align: center; font-size: 0.7rem; color: #00FF88; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #1a2a2a; border-radius: 28px; padding: 20px; width: 90%; max-width: 400px; border: 2px solid #FFD700; }
        @media (max-width: 700px) { .bet-row { flex-direction: column; } .bet-btn { min-width: auto; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>⚡ SOCCER BET</h1><div style="font-size:0.55rem;">Asian Handicap • Over/Under</div></div>
        <div id="authSection"><div class="user-menu"><button class="menu-btn" id="showLoginBtn">Login</button><button class="menu-btn" id="showSignupBtn">Sign Up</button></div></div>
        <div id="userSection" style="display:none;"><div class="user-menu"><span id="usernameDisplay"></span><span class="balance-value" id="balanceDisplay">0</span><button class="menu-btn" id="logoutBtn">Exit</button></div></div>
    </div>

    <div id="apiStatus" class="api-status">🔄 Loading live matches...</div>
    <div id="matchesContainer"></div>

    <div class="bottom-bar">
        <button class="bottom-btn" id="viewSlipBtn">📋 SLIP (<span id="slipCount">0</span>)</button>
        <button class="bottom-btn" id="viewHistoryBtn">📜 HISTORY</button>
    </div>
</div>

<!-- MODALS -->
<div id="slipModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">📋 BET SLIP</div><div id="slipList"></div><div style="margin:10px 0; padding:10px; background:#0a1a1a;"><div>Total Odds: <span id="totalOdds">0x</span></div><div>Stake: <input type="number" id="stakeInput" value="10" min="5"></div><div>Win: <span id="potentialWin">0</span> USDT</div></div><button id="confirmBetBtn" class="btn-primary">CONFIRM</button><button id="clearSlipBtn" class="btn-primary" style="background:#2a2a2a;">Clear</button><button class="btn-primary" onclick="closeSlipModal()">Close</button></div></div>
<div id="historyModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">📜 HISTORY</div><div id="historyList"></div><button class="btn-primary" onclick="closeHistoryModal()">Close</button></div></div>
<div id="authModal" class="modal-overlay"><div class="modal-content"><h2 style="color:#FFD700;">Login</h2><input type="email" id="loginEmail" placeholder="Email"><input type="password" id="loginPassword" placeholder="Password"><button id="doLoginBtn">Login</button><button id="switchToSignupBtn">Sign Up</button><button onclick="closeAuthModal()">Close</button></div></div>
<div id="signupModal" class="modal-overlay"><div class="modal-content"><h2 style="color:#FFD700;">Sign Up</h2><input type="text" id="signupUsername" placeholder="Username"><input type="email" id="signupEmail" placeholder="Email"><input type="password" id="signupPassword" placeholder="Password"><input type="password" id="signupConfirm" placeholder="Confirm Password"><button id="doSignupBtn">Sign Up</button><button onclick="closeSignupModal()">Close</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// ============================================================
// SIMPLE WORKING VERSION - HANDICAP & OVER/UNDER FROM API
// ============================================================

let token = localStorage.getItem('authToken');
let currentUserId = null, currentBalance = 0, currentUsername = "";
let bettingSlip = [];
let liveMatches = [];

// DOM
const balanceDisplay = document.getElementById('balanceDisplay');
const usernameDisplay = document.getElementById('usernameDisplay');
const matchesContainer = document.getElementById('matchesContainer');
const apiStatus = document.getElementById('apiStatus');
const slipCount = document.getElementById('slipCount');

// ============================================================
// AUTH
// ============================================================
async function checkSession() {
    if (!token) return;
    try {
        const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
            const user = await res.json();
            currentUserId = user.id;
            currentBalance = user.balance;
            currentUsername = user.username;
            balanceDisplay.innerText = currentBalance.toLocaleString() + " USDT";
            usernameDisplay.innerText = currentUsername;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('userSection').style.display = 'flex';
            fetchLiveMatches();
            return;
        }
    } catch(e) {}
}

async function login(email, password) {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (data.success) {
        token = data.token;
        localStorage.setItem('authToken', token);
        currentUserId = data.user.id;
        currentBalance = data.user.balance;
        currentUsername = data.user.username;
        balanceDisplay.innerText = currentBalance.toLocaleString() + " USDT";
        usernameDisplay.innerText = currentUsername;
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('userSection').style.display = 'flex';
        closeAuthModal();
        fetchLiveMatches();
    } else { alert(data.error); }
}

async function signup(username, email, password, confirm) {
    if (password !== confirm) { alert("Passwords do not match"); return; }
    const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password, confirmPassword: confirm }) });
    const data = await res.json();
    if (data.success) { alert('Account created! Please login.'); closeSignupModal(); openAuthModal(); }
    else { alert(data.error); }
}

function logout() {
    localStorage.removeItem('authToken');
    token = null;
    currentUserId = null;
    bettingSlip = [];
    updateSlipCount();
    document.getElementById('authSection').style.display = 'flex';
    document.getElementById('userSection').style.display = 'none';
    matchesContainer.innerHTML = '<div style="text-align:center; padding:40px;">🔐 Please login</div>';
}

function updateSlipCount() { slipCount.innerText = bettingSlip.length; }

// ============================================================
// FETCH LIVE MATCHES
// ============================================================
async function fetchLiveMatches() {
    apiStatus.innerHTML = "🔄 Fetching live matches...";
    try {
        const res = await fetch('/api/live-scores');
        const data = await res.json();
        if (data && data.length > 0) {
            liveMatches = data;
            apiStatus.innerHTML = `✅ ${liveMatches.length} live matches`;
            renderMatches();
            for (const match of liveMatches) {
                fetchOddsForMatch(match.matchId);
            }
        } else {
            apiStatus.innerHTML = "⚠️ No live matches";
            matchesContainer.innerHTML = '<div style="text-align:center; padding:40px;">⚽ No live matches right now</div>';
        }
    } catch(e) { apiStatus.innerHTML = "❌ Error"; }
}

async function fetchOddsForMatch(matchId) {
    try {
        const res = await fetch(`/api/match-odds/${matchId}?companyId=31`);
        const data = await res.json();
        if (data && data.data && data.data[0]) {
            updateMatchOdds(matchId, data.data[0]);
        }
    } catch(e) {}
}

function updateMatchOdds(matchId, odds) {
    const card = document.querySelector(`.match-card[data-id='${matchId}']`);
    if (!card) return;
    
    // Update 1X2
    const homeEl = card.querySelector('.odds-home');
    const drawEl = card.querySelector('.odds-draw');
    const awayEl = card.querySelector('.odds-away');
    if (homeEl) homeEl.innerText = odds.odds_home?.toFixed(2) || '2.00';
    if (drawEl) drawEl.innerText = odds.odds_draw?.toFixed(2) || '3.20';
    if (awayEl) awayEl.innerText = odds.odds_away?.toFixed(2) || '3.50';
    
    // Update Asian Handicap
    if (odds.asian_handicap && odds.asian_handicap.length > 0) {
        const handicapContainer = card.querySelector('.handicap-container');
        if (handicapContainer) {
            handicapContainer.innerHTML = odds.asian_handicap.slice(0, 3).map(h => `
                <div class="bet-btn" data-type="handicap" data-line="${h.line}" data-home="${h.home}" data-away="${h.away}">
                    <div class="bet-label">${h.line}</div>
                    <div class="bet-value">${h.home.toFixed(2)} / ${h.away.toFixed(2)}</div>
                </div>
            `).join('');
        }
    }
    
    // Update Over/Under
    if (odds.over_under && odds.over_under.length > 0) {
        const ouContainer = card.querySelector('.ou-container');
        if (ouContainer) {
            ouContainer.innerHTML = odds.over_under.slice(0, 3).map(ou => `
                <div class="bet-btn" data-type="ou" data-line="${ou.line}" data-over="${ou.over}" data-under="${ou.under}">
                    <div class="bet-label">${ou.line}</div>
                    <div class="bet-value">O:${ou.over.toFixed(2)} U:${ou.under.toFixed(2)}</div>
                </div>
            `).join('');
        }
    }
}

function renderMatches() {
    matchesContainer.innerHTML = liveMatches.map(m => `
        <div class="match-card" data-id="${m.matchId}">
            <div class="match-header">
                <span>🏆 ${m.leagueName || "Football"}</span>
                <span>🔴 LIVE ${m.homeScore} - ${m.awayScore}</span>
            </div>
            <div class="match-teams">
                <div class="team-name">${escapeHtml(m.homeName)}</div>
                <div class="vs">VS</div>
                <div class="team-name">${escapeHtml(m.awayName)}</div>
            </div>
            
            <div class="market-title">⚡ 1X2 (Moneyline)</div>
            <div class="bet-row">
                <div class="bet-btn" data-type="1x2" data-selection="home" data-odds="2.00" data-name="${escapeHtml(m.homeName)}">
                    <div class="bet-label">HOME</div>
                    <div class="bet-value odds-home">2.00</div>
                </div>
                <div class="bet-btn" data-type="1x2" data-selection="draw" data-odds="3.20">
                    <div class="bet-label">DRAW</div>
                    <div class="bet-value odds-draw">3.20</div>
                </div>
                <div class="bet-btn" data-type="1x2" data-selection="away" data-odds="3.50" data-name="${escapeHtml(m.awayName)}">
                    <div class="bet-label">AWAY</div>
                    <div class="bet-value odds-away">3.50</div>
                </div>
            </div>
            
            <div class="market-title">⚽ Asian Handicap</div>
            <div class="bet-row handicap-container">
                <div class="bet-btn"><div class="bet-label">Loading...</div></div>
            </div>
            
            <div class="market-title">📊 Over / Under</div>
            <div class="bet-row ou-container">
                <div class="bet-btn"><div class="bet-label">Loading...</div></div>
            </div>
        </div>
    `).join('');
    
    // Attach click handlers for 1X2 bets
    document.querySelectorAll('.bet-btn[data-type="1x2"]').forEach(btn => {
        btn.addEventListener('click', () => {
            const matchId = btn.closest('.match-card').dataset.id;
            const match = liveMatches.find(m => m.matchId == matchId);
            if (!match) return;
            const selection = btn.dataset.selection === 'home' ? match.homeName : (btn.dataset.selection === 'away' ? match.awayName : 'Draw');
            const odds = parseFloat(btn.dataset.odds);
            addToSlip(`${match.homeName} vs ${match.awayName}`, selection, odds);
        });
    });
}

function addToSlip(matchName, selection, odds) {
    bettingSlip.push({ matchName, selection, odds, stake: 10 });
    updateSlipCount();
}

function openSlipModal() {
    const container = document.getElementById('slipList');
    if (bettingSlip.length === 0) { alert("No bets selected"); return; }
    let totalOdds = 1;
    container.innerHTML = bettingSlip.map((b, i) => {
        totalOdds *= b.odds;
        return `<div style="background:#0a1a1a; padding:10px; margin-bottom:8px; border-radius:12px;">
            <div>${escapeHtml(b.matchName)}</div>
            <div style="color:#FFD700;">${escapeHtml(b.selection)} @ ${b.odds.toFixed(2)}x</div>
            <div>Stake: <input type="number" value="${b.stake}" class="stake-input" data-idx="${i}" style="width:80px;"></div>
            <button onclick="removeFromSlip(${i})" style="background:#3a1a1a; border:none; padding:4px 8px; border-radius:20px;">Remove</button>
        </div>`;
    }).join('');
    document.getElementById('totalOdds').innerText = totalOdds.toFixed(2) + 'x';
    const stake = parseFloat(document.getElementById('stakeInput').value) || 10;
    document.getElementById('potentialWin').innerText = (stake * totalOdds).toFixed(2);
    document.getElementById('stakeInput').oninput = () => {
        let s = parseFloat(document.getElementById('stakeInput').value) || 10;
        document.getElementById('potentialWin').innerText = (s * totalOdds).toFixed(2);
    };
    document.getElementById('slipModal').style.display = 'flex';
    
    document.querySelectorAll('.stake-input').forEach(inp => {
        inp.addEventListener('change', (e) => {
            let idx = parseInt(inp.dataset.idx);
            bettingSlip[idx].stake = parseFloat(inp.value) || 10;
        });
    });
}

window.removeFromSlip = function(idx) {
    bettingSlip.splice(idx, 1);
    updateSlipCount();
    openSlipModal();
};

async function placeBet() {
    if (bettingSlip.length === 0) { alert("No bets"); return; }
    let totalStake = bettingSlip.reduce((s, b) => s + b.stake, 0);
    if (totalStake > currentBalance) { alert("Insufficient balance"); return; }
    let totalOdds = bettingSlip.reduce((p, b) => p * b.odds, 1);
    const res = await fetch('/api/place-bet', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ bets: bettingSlip, totalStake, totalOdds }) });
    const data = await res.json();
    if (data.success) {
        currentBalance = data.newBalance;
        balanceDisplay.innerText = currentBalance.toLocaleString() + " USDT";
        alert(`✅ Bet placed! Stake: ${totalStake} USDT | Odds: ${totalOdds.toFixed(2)}x`);
        bettingSlip = [];
        updateSlipCount();
        closeSlipModal();
    } else { alert(data.error); }
}

// Modal functions
function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
function openSignupModal() { document.getElementById('signupModal').style.display = 'flex'; }
function closeSignupModal() { document.getElementById('signupModal').style.display = 'none'; }
function closeSlipModal() { document.getElementById('slipModal').style.display = 'none'; }
function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }
function showHistory() { document.getElementById('historyModal').style.display = 'flex'; }

document.getElementById('viewSlipBtn')?.addEventListener('click', openSlipModal);
document.getElementById('viewHistoryBtn')?.addEventListener('click', showHistory);
document.getElementById('confirmBetBtn')?.addEventListener('click', placeBet);
document.getElementById('clearSlipBtn')?.addEventListener('click', () => { bettingSlip = []; updateSlipCount(); closeSlipModal(); });
document.getElementById('showLoginBtn')?.addEventListener('click', openAuthModal);
document.getElementById('showSignupBtn')?.addEventListener('click', openSignupModal);
document.getElementById('switchToSignupBtn')?.addEventListener('click', () => { closeAuthModal(); openSignupModal(); });
document.getElementById('doLoginBtn')?.addEventListener('click', () => login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value));
document.getElementById('doSignupBtn')?.addEventListener('click', () => signup(document.getElementById('signupUsername').value, document.getElementById('signupEmail').value, document.getElementById('signupPassword').value, document.getElementById('signupConfirm').value));
document.getElementById('logoutBtn')?.addEventListener('click', logout);

function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }

checkSession();
</script>
</body>
</html>
