<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>⚡ 5D SOCCER BET | Live Odds | Asian Handicap | Over/Under</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at 20% 30%, #0a2a1f, #051a10);
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 100px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background Particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 40%, rgba(255,215,0,0.08) 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, rgba(0,255,136,0.05) 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px;
            pointer-events: none;
            z-index: 0;
            animation: floatBg 20s linear infinite;
        }

        @keyframes floatBg {
            0% { transform: translateY(0px); }
            100% { transform: translateY(50px); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* GLOWING HEADER */
        .header {
            background: rgba(10, 20, 15, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.1);
            animation: borderPulse 3s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% { border-color: rgba(255,215,0,0.3); box-shadow: 0 0 10px rgba(255,215,0,0.1); }
            50% { border-color: rgba(255,215,0,0.8); box-shadow: 0 0 25px rgba(255,215,0,0.3); }
        }

        .logo h1 {
            background: linear-gradient(135deg, #FFD700, #FFA500, #FF6B35);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.4rem;
            font-weight: 800;
            animation: textShine 3s infinite;
        }

        @keyframes textShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 60px;
            border: 1px solid #FFD700;
            backdrop-filter: blur(10px);
        }

        .username { color: #FFD700; font-weight: bold; font-size: 0.8rem; }
        .balance-value { font-size: 1rem; font-weight: bold; color: #00FF88; text-shadow: 0 0 5px #00FF88; }
        .menu-btn {
            background: linear-gradient(135deg, #1a1a2e, #0a0a1a);
            border: 1px solid #FFD700;
            padding: 5px 12px;
            border-radius: 30px;
            color: #FFD700;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s;
        }
        .menu-btn:hover { transform: scale(1.05); background: #FFD700; color: #000; box-shadow: 0 0 15px #FFD700; }

        /* BET MODE TABS - 3D */
        .bet-mode-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 50px;
            background: rgba(20, 30, 25, 0.8);
            backdrop-filter: blur(10px);
            color: #aaa;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid rgba(255,215,0,0.3);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .mode-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent);
            transition: left 0.5s;
        }
        .mode-tab:hover::before { left: 100%; }
        .mode-tab.active {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
            transform: scale(1.02);
        }

        /* SPORT TABS */
        .sport-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 50px;
        }
        .sport-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 40px;
            background: transparent;
            color: #ccc;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sport-tab.active {
            background: #FFD700;
            color: #000;
            box-shadow: 0 0 15px #FFD700;
        }

        /* LEAGUE GROUPS */
        .league-group {
            background: rgba(20, 30, 25, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,215,0,0.3);
            transition: all 0.3s;
        }
        .league-group:hover { border-color: #FFD700; box-shadow: 0 0 20px rgba(255,215,0,0.2); }

        .league-header {
            background: rgba(0,0,0,0.5);
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .league-name { color: #FFD700; font-weight: bold; font-size: 0.9rem; }
        .league-count { color: #aaa; font-size: 0.7rem; }

        .league-matches { padding: 12px; display: block; }
        .league-matches.collapsed { display: none; }

        /* MATCH CARD - 3D HOVER */
        .match-card {
            background: linear-gradient(135deg, rgba(15, 25, 20, 0.9), rgba(10, 20, 15, 0.9));
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,215,0,0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .match-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: #FFD700;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.15);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #FFD700;
            font-size: 0.7rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .match-team {
            flex: 1;
            text-align: center;
        }
        .match-team-name { font-weight: bold; color: #FFFFFF; font-size: 0.85rem; }
        .match-vs { color: #FFD700; font-size: 0.8rem; font-weight: bold; }

        /* BET BUTTONS */
        .bet-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .bet-team-btn {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .bet-team-btn:active { transform: scale(0.96); background: #FFD700; }
        .bet-team-btn:active .bet-label { color: #000; }
        .bet-team-btn:active .bet-odds { color: #000; }
        .bet-label { font-size: 0.65rem; color: #FFD700; }
        .bet-odds { font-size: 1rem; font-weight: bold; color: #00FF88; }

        /* ASIAN HANDICAP & OVER/UNDER SECTIONS */
        .market-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255,215,0,0.2);
        }
        .market-title {
            font-size: 0.65rem;
            color: #FFA500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .handicap-row, .total-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .handicap-btn, .total-btn {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 200, 150, 0.4);
            border-radius: 12px;
            padding: 6px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
        }
        .handicap-btn:active, .total-btn:active { transform: scale(0.96); background: #FFD700; }
        .handicap-line { font-size: 0.6rem; color: #aaa; }
        .handicap-odds { font-size: 0.85rem; font-weight: bold; color: #00FF88; }

        /* SELECTED STYLES */
        .selected-for-parlay {
            background: #FFD700 !important;
            border-color: #FFD700 !important;
        }
        .selected-for-parlay .bet-label,
        .selected-for-parlay .bet-odds,
        .selected-for-parlay .handicap-line,
        .selected-for-parlay .handicap-odds { color: #000 !important; }

        /* BOTTOM BAR */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-top: 2px solid #FFD700;
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }
        .bottom-btn {
            flex: 1;
            background: linear-gradient(135deg, #1a1a2e, #0a0a1a);
            border: 1px solid #FFD700;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: #FFD700;
            transition: all 0.2s;
        }
        .bottom-btn:active { transform: scale(0.97); background: #FFD700; color: #000; }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: linear-gradient(135deg, #1a2a2a, #0a1a1a);
            border-radius: 32px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            border: 2px solid #FFD700;
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            color: #FFD700;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        .api-status {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.8rem;
            color: #00FF88;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #0a1a1a;
            border: 1px solid #FFD700;
            border-radius: 30px;
            color: white;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #FFD700;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .match-teams { flex-direction: column; gap: 8px; }
            .match-vs { display: none; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>⚡ 5D SOCCER BET</h1><div style="font-size:0.55rem; color:#FFD700;">Asian Handicap • Over/Under • SBOBET</div></div>
        <div id="authSection"><div class="user-menu"><button class="menu-btn" id="showLoginBtn">Login</button><button class="menu-btn" id="showSignupBtn">Sign Up</button></div></div>
        <div id="userSection" style="display:none;"><div class="user-menu"><span class="username" id="usernameDisplay"></span><span class="balance-value" id="balanceDisplay">0</span><button class="menu-btn" id="depositBtn">💰</button><button class="menu-btn" id="withdrawBtn">💸</button><button class="menu-btn logout-btn" id="logoutBtn">Exit</button></div></div>
    </div>

    <div id="apiStatus" class="api-status">🔄 Loading matches...</div>

    <div class="bet-mode-tabs">
        <button class="mode-tab active" data-mode="single">🎯 SINGLE BET</button>
        <button class="mode-tab" data-mode="parlay">📊 PARLAY BUILDER</button>
    </div>

    <div class="sport-tabs">
        <button class="sport-tab active" data-tab="today">📅 TODAY</button>
        <button class="sport-tab" data-tab="tomorrow">⭐ TOMORROW</button>

    <div id="matchesContainer"></div>

    <div class="bottom-bar">
        <button class="bottom-btn" id="viewSlipBtn">📋 SLIP (<span id="slipCount">0</span>)</button>
        <button class="bottom-btn" id="viewHistoryBtn">📜 HISTORY</button>
    </div>
</div>

<!-- MODALS -->
<div id="slipModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">📋 BET SLIP</div><div id="slipItemsList"></div><div id="totalOddsDisplay" style="margin:10px 0; padding:10px; background:#0a1a1a; border-radius:16px; text-align:center;"><div>Parlay Odds: <span id="totalOddsValue">0x</span></div><div>Stake: <input type="number" id="betStakeInput" style="width:100px; background:#0a1a1a; border:1px solid #FFD700; border-radius:20px; padding:5px; color:#00FF88;"></div><div>Potential Win: <span id="totalWinValue">0</span> USDT</div></div><button id="confirmBetBtn" class="btn-primary">✅ CONFIRM BET</button><button id="clearSlipBtn" class="btn-primary" style="background:#2a2a2a;">Clear</button><button class="btn-primary" style="background:#2a2a2a;" onclick="closeSlipModal()">Close</button></div></div>
<div id="receiptModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">🎉 BET RECEIPT</div><div id="receiptContent"></div><button class="btn-primary" onclick="closeReceiptModal()">Close</button></div></div>
<div id="historyModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">📜 BET HISTORY</div><div id="historyList"></div><button class="btn-primary" onclick="closeHistoryModal()">Close</button></div></div>
<div id="authModal" class="modal-overlay"><div class="modal-content"><h2 id="authTitle" style="color:#FFD700;">Login</h2><div id="loginFields"><input type="email" id="loginEmail" class="input-field" placeholder="Email"><input type="password" id="loginPassword" class="input-field" placeholder="Password"><button id="doLoginBtn" class="btn-primary">Login</button></div><div id="signupFields" style="display:none;"><input type="text" id="signupUsername" class="input-field" placeholder="Username"><input type="email" id="signupEmail" class="input-field" placeholder="Email"><input type="password" id="signupPassword" class="input-field" placeholder="Password"><input type="password" id="signupConfirmPassword" class="input-field" placeholder="Confirm Password"><input type="text" id="signupWallet" class="input-field" placeholder="TRC-20 Wallet (optional)"><button id="doSignupBtn" class="btn-primary">Sign Up</button></div><button id="switchAuthModeBtn" class="btn-primary" style="background:transparent; border:1px solid #FFD700;">Switch Mode</button><button class="btn-primary" style="background:#2a2a2a;" onclick="closeAuthModal()">Close</button></div></div>
<div id="depositModal" class="modal-overlay"><div class="modal-content" style="text-align:center;"><div class="modal-title">Deposit USDT</div><div id="qrCode" style="display:flex; justify-content:center; margin:15px 0;"></div><div style="background:#0a1a1a; padding:12px; border-radius:16px; color:#FFD700; font-size:0.7rem;">TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg</div><button id="copyDepositAddrBtn" class="btn-primary">Copy Address</button><button class="btn-primary" style="background:#2a2a2a;" onclick="closeDepositModal()">Close</button></div></div>
<div id="withdrawModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">Withdraw USDT</div><input type="text" id="withdrawAddress" class="input-field" placeholder="TRC-20 Wallet Address"><input type="number" id="withdrawAmount" class="input-field" placeholder="Amount (USDT)" min="10"><div id="withdrawMsg" style="color:#FF6666;"></div><button id="submitWithdrawBtn" class="btn-primary">Request Withdrawal</button><button class="btn-primary" style="background:#2a2a2a;" onclick="closeWithdrawModal()">Close</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
let token = localStorage.getItem('authToken');
let currentUserId = null, currentUserBalance = 0, currentUsername = "";
let betMode = "single";
let singleBet = null;
let parlayBets = [];
let currentTab = "today";
let upcomingMatches = [];
let userBets = [];

const balanceDisplay = document.getElementById('balanceDisplay');
const usernameDisplay = document.getElementById('usernameDisplay');
const matchesContainer = document.getElementById('matchesContainer');
const apiStatusDiv = document.getElementById('apiStatus');
const authSection = document.getElementById('authSection');
const userSection = document.getElementById('userSection');
const slipCountSpan = document.getElementById('slipCount');

async function checkSession() {
    if (!token) return false;
    try {
        const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
            const user = await res.json();
            currentUserId = user.id;
            currentUserBalance = user.balance;
            currentUsername = user.username;
            updateBalanceUI();
            usernameDisplay.innerText = currentUsername;
            authSection.style.display = 'none';
            userSection.style.display = 'block';
            fetchMatches();
            fetchUserBets();
            return true;
        } else { localStorage.removeItem('authToken'); token = null; return false; }
    } catch(e) { return false; }
}

async function login(email, password) {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (data.success) {
        token = data.token; localStorage.setItem('authToken', token);
        currentUserId = data.user.id; currentUserBalance = data.user.balance; currentUsername = data.user.username;
        updateBalanceUI(); usernameDisplay.innerText = currentUsername;
        authSection.style.display = 'none'; userSection.style.display = 'block';
        closeAuthModal(); fetchMatches(); fetchUserBets();
        return true;
    } else { alert(data.error); return false; }
}

async function signup(username, email, password, confirm, wallet) {
    if (password !== confirm) { alert("Passwords do not match"); return; }
    const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password, confirmPassword: confirm, walletAddress: wallet }) });
    const data = await res.json();
    if (data.success) { alert('Account created! Please login.'); switchToLogin(); return true; }
    else { alert(data.error); return false; }
}

function logout() { localStorage.removeItem('authToken'); token = null; currentUserId = null; singleBet = null; parlayBets = []; updateSlipCount(); authSection.style.display = 'block'; userSection.style.display = 'none'; matchesContainer.innerHTML = '<div style="text-align:center; padding:40px;">🔐 Please login</div>'; }
function updateBalanceUI() { balanceDisplay.innerText = currentUserBalance.toLocaleString() + " USDT"; }
function updateSlipCount() { slipCountSpan.innerText = betMode === "single" ? (singleBet ? 1 : 0) : parlayBets.length; }

async function fetchMatches() {
    if (!currentUserId) return;
    apiStatusDiv.innerHTML = "🔄 Fetching matches...";
    const date = currentTab === 'tomorrow' ? new Date(Date.now() + 86400000).toISOString().split('T')[0] : new Date().toISOString().split('T')[0];
    try {
        const res = await fetch(`/api/upcoming-matches?date=${date}`);
        const data = await res.json();
        if (!data || data.length === 0) { apiStatusDiv.innerHTML = "⚠️ No matches"; matchesContainer.innerHTML = '<div style="text-align:center; padding:40px;">⚽ No matches</div>'; return; }
        upcomingMatches = data;
        apiStatusDiv.innerHTML = `✅ ${upcomingMatches.length} matches`;
        renderMatches();
        for (const match of upcomingMatches) { fetchOddsForMatch(match.fixture_id); }
    } catch(e) { apiStatusDiv.innerHTML = "❌ Error loading matches"; }
}

async function fetchOddsForMatch(matchId) {
    try {
        const res = await fetch(`/api/match-odds/${matchId}?companyId=31`);
        const data = await res.json();
        if (data && data.data) { updateMatchOdds(matchId, data.data); }
    } catch(e) {}
}

function updateMatchOdds(matchId, oddsData) {
    const matchCard = document.querySelector(`.match-card[data-id='${matchId}']`);
    if (!matchCard) return;
    const odds = oddsData[0] || {};
    matchCard.querySelector('.bet-odds-home').innerText = odds.odds_home?.toFixed(2) || '2.00';
    matchCard.querySelector('.bet-odds-draw').innerText = odds.odds_draw?.toFixed(2) || '3.20';
    matchCard.querySelector('.bet-odds-away').innerText = odds.odds_away?.toFixed(2) || '3.50';
}

function renderMatches() {
    matchesContainer.innerHTML = upcomingMatches.map(m => `
        <div class="match-card" data-id="${m.fixture_id}">
            <div class="match-header"><span>🏆 ${m.league_name}</span><span>📅 ${new Date(m.event_date).toLocaleString()}</span></div>
            <div class="match-teams">
                <div class="match-team"><div class="match-team-name">${escapeHtml(m.home_team)}</div><button class="bet-team-btn" data-match-name="${escapeHtml(m.home_team)} vs ${escapeHtml(m.away_team)}" data-team="${escapeHtml(m.home_team)}" data-odds="2.00"><div class="bet-label">HOME</div><div class="bet-odds bet-odds-home">2.00</div></button></div>
                <div class="match-vs">VS</div>
                <div class="match-team"><div class="match-team-name">${escapeHtml(m.away_team)}</div><button class="bet-team-btn" data-match-name="${escapeHtml(m.home_team)} vs ${escapeHtml(m.away_team)}" data-team="${escapeHtml(m.away_team)}" data-odds="3.50"><div class="bet-label">AWAY</div><div class="bet-odds bet-odds-away">3.50</div></button></div>
            </div>
            <div class="bet-row"><button class="bet-team-btn" data-match-name="${escapeHtml(m.home_team)} vs ${escapeHtml(m.away_team)}" data-team="Draw" data-odds="3.20"><div class="bet-label">DRAW</div><div class="bet-odds bet-odds-draw">3.20</div></button></div>
        </div>
    `).join('');
    document.querySelectorAll('.bet-team-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); selectBet(btn.dataset.matchName, btn.dataset.team, parseFloat(btn.dataset.odds)); }));
}

function selectBet(matchName, team, odds) {
    if (betMode === "single") { singleBet = { matchName, team, odds }; updateSlipCount(); document.querySelectorAll('.bet-team-btn').forEach(btn => btn.classList.remove('selected-for-parlay')); }
    else {
        const exists = parlayBets.some(b => b.matchName === matchName && b.team === team);
        if (exists) parlayBets = parlayBets.filter(b => !(b.matchName === matchName && b.team === team));
        else parlayBets.push({ matchName, team, odds });
        updateSlipCount();
        document.querySelectorAll('.bet-team-btn').forEach(btn => {
            if (parlayBets.some(b => b.matchName === btn.dataset.matchName && b.team === btn.dataset.team)) btn.classList.add('selected-for-parlay');
            else btn.classList.remove('selected-for-parlay');
        });
    }
}

function openSlipModal() {
    const slipContainer = document.getElementById('slipItemsList');
    let betsList = betMode === "single" ? (singleBet ? [singleBet] : []) : parlayBets;
    if (betsList.length === 0) { alert("No bets selected"); return; }
    slipContainer.innerHTML = betsList.map(b => `<div style="background:#0a1a1a; border-radius:16px; padding:12px; margin-bottom:8px;"><div>${escapeHtml(b.matchName)}</div><div style="color:#FFD700;">${escapeHtml(b.team)} @ ${b.odds.toFixed(2)}x</div></div>`).join('');
    const totalOdds = betsList.reduce((t, b) => t * b.odds, 1);
    document.getElementById('totalOddsValue').innerText = totalOdds.toFixed(2) + 'x';
    document.getElementById('totalWinValue').innerText = (10 * totalOdds).toFixed(2);
    document.getElementById('betStakeInput').value = 10;
    document.getElementById('betStakeInput').oninput = () => { let s = parseFloat(document.getElementById('betStakeInput').value) || 10; document.getElementById('totalWinValue').innerText = (s * totalOdds).toFixed(2); };
    document.getElementById('slipModal').style.display = 'flex';
}
async function placeBet() {
    let betsList = betMode === "single" ? (singleBet ? [singleBet] : []) : parlayBets;
    if (betsList.length === 0) { alert("No bets selected"); return; }
    const stake = parseFloat(document.getElementById('betStakeInput').value) || 10;
    if (stake > currentUserBalance) { alert("Insufficient balance"); return; }
    const totalOdds = betsList.reduce((t, b) => t * b.odds, 1);
    const res = await fetch('/api/place-bet', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ bets: betsList, totalStake: stake, totalOdds }) });
    const data = await res.json();
    if (data.success) { currentUserBalance = data.newBalance; updateBalanceUI(); alert(`✅ Bet placed! Stake: ${stake} USDT | Odds: ${totalOdds.toFixed(2)}x`); singleBet = null; parlayBets = []; updateSlipCount(); closeSlipModal(); fetchUserBets(); }
    else alert(data.error);
}
async function fetchUserBets() {
    if (!token) return;
    const res = await fetch('/api/user-bets', { headers: { 'Authorization': `Bearer ${token}` } });
    const bets = await res.json();
    userBets = bets;
    if (userBets.length) document.getElementById('historyList').innerHTML = bets.slice().reverse().map(b => `<div style="background:#0a1a1a; border-radius:16px; padding:12px; margin-bottom:8px;"><div>${new Date(b.timestamp).toLocaleString()}</div><div>Stake: ${b.totalStake} USDT | Odds: ${b.totalOdds.toFixed(2)}x</div><div style="color:#FFA500;">Status: ${b.status || 'Pending'}</div></div>`).join('');
    else document.getElementById('historyList').innerHTML = '<div style="text-align:center;">No bets yet</div>';
}
function showHistory() { fetchUserBets(); document.getElementById('historyModal').style.display = 'flex'; }
function closeSlipModal() { document.getElementById('slipModal').style.display = 'none'; }
function closeReceiptModal() { document.getElementById('receiptModal').style.display = 'none'; }
function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }
function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
function closeDepositModal() { document.getElementById('depositModal').style.display = 'none'; }
function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }

document.getElementById('viewSlipBtn')?.addEventListener('click', openSlipModal);
document.getElementById('viewHistoryBtn')?.addEventListener('click', showHistory);
document.getElementById('confirmBetBtn')?.addEventListener('click', placeBet);
document.getElementById('clearSlipBtn')?.addEventListener('click', () => { singleBet = null; parlayBets = []; updateSlipCount(); alert("Slip cleared"); });
document.querySelectorAll('.mode-tab').forEach(tab => tab.addEventListener('click', () => { betMode = tab.dataset.mode; document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); singleBet = null; parlayBets = []; updateSlipCount(); document.querySelectorAll('.bet-team-btn').forEach(btn=>btn.classList.remove('selected-for-parlay')); }));
document.querySelectorAll('.sport-tab').forEach(tab => tab.addEventListener('click', () => { currentTab = tab.dataset.tab; document.querySelectorAll('.sport-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); fetchMatches(); }));
document.getElementById('showLoginBtn')?.addEventListener('click', () => { switchToLogin(); document.getElementById('authModal').style.display = 'flex'; });
document.getElementById('showSignupBtn')?.addEventListener('click', () => { switchToSignup(); document.getElementById('authModal').style.display = 'flex'; });
document.getElementById('doLoginBtn')?.addEventListener('click', () => login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value));
document.getElementById('doSignupBtn')?.addEventListener('click', () => signup(document.getElementById('signupUsername').value, document.getElementById('signupEmail').value, document.getElementById('signupPassword').value, document.getElementById('signupConfirmPassword').value, document.getElementById('signupWallet').value));
document.getElementById('switchAuthModeBtn')?.addEventListener('click', () => { isLoginMode = !isLoginMode; if(isLoginMode) switchToLogin(); else switchToSignup(); });
document.getElementById('depositBtn')?.addEventListener('click', () => { document.getElementById('depositModal').style.display = 'flex'; setTimeout(() => { if(typeof QRCode !== 'undefined') { document.getElementById('qrCode').innerHTML = ''; new QRCode(document.getElementById('qrCode'), { text: 'TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg', width: 180, height: 180 }); } }, 100); });
document.getElementById('copyDepositAddrBtn')?.addEventListener('click', () => { navigator.clipboard.writeText('TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg'); alert('Address copied!'); });
document.getElementById('withdrawBtn')?.addEventListener('click', () => document.getElementById('withdrawModal').style.display = 'flex');
document.getElementById('submitWithdrawBtn')?.addEventListener('click', async () => { const addr = document.getElementById('withdrawAddress').value; const amt = parseFloat(document.getElementById('withdrawAmount').value); if(!addr || amt<10) { document.getElementById('withdrawMsg').innerText = 'Invalid'; return; } const res = await fetch('/api/withdraw-request', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ amount: amt, walletAddress: addr }) }); const data = await res.json(); if(data.success) { alert('Request submitted'); closeWithdrawModal(); } else alert(data.error); });
document.getElementById('logoutBtn')?.addEventListener('click', logout);
let isLoginMode = true;
function switchToLogin() { isLoginMode = true; document.getElementById('authTitle').innerText = 'Login'; document.getElementById('loginFields').style.display = 'block'; document.getElementById('signupFields').style.display = 'none'; }
function switchToSignup() { isLoginMode = false; document.getElementById('authTitle').innerText = 'Sign Up'; document.getElementById('loginFields').style.display = 'none'; document.getElementById('signupFields').style.display = 'block'; }
function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;':(m==='<'?'&lt;':'&gt;')); }
window.closeSlipModal = closeSlipModal; window.closeReceiptModal = closeReceiptModal; window.closeHistoryModal = closeHistoryModal; window.closeAuthModal = closeAuthModal; window.closeDepositModal = closeDepositModal; window.closeWithdrawModal = closeWithdrawModal;
checkSession();
</script>
</body>
</html>
