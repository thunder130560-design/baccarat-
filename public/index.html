<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>⚽ SOCCER BET | Single | Parlay | USDT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a2a1f 0%, #0b3b25 100%);
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: #1a2a2e;
            border-radius: 28px;
            padding: 12px 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 2px solid #FFD700;
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }

        .logo h1 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.2rem;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0a1a1a;
            padding: 5px 12px;
            border-radius: 50px;
            border: 1px solid #FFD700;
            flex-wrap: wrap;
        }

        .username { color: #FFD700; font-size: 0.8rem; font-weight: bold; }
        .balance-value { font-size: 1rem; font-weight: bold; color: #00FF88; }
        .menu-btn {
            background: #1a1a2e;
            border: 1px solid #FFD700;
            padding: 4px 12px;
            border-radius: 30px;
            color: #FFD700;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .logout-btn { background: #4a1a1a; border-color: #FF6666; color: #FFAAAA; }
        .auth-buttons { display: flex; gap: 10px; }
        .auth-btn {
            background: #FFD700;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            color: #000;
        }

        /* BET MODE TABS */
        .bet-mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 40px;
            background: #1a2a2a;
            color: #aaa;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #FFD70040;
        }
        .mode-tab.active {
            background: #FFD700;
            color: #000;
            border-color: #FFD700;
        }

        /* SPORT TABS (Live/Early/Today) */
        .sport-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #1a2a2a;
            padding: 5px;
            border-radius: 50px;
        }
        .sport-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            border-radius: 40px;
            background: transparent;
            color: #ccc;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .sport-tab.active {
            background: #FFD700;
            color: #000;
        }

        /* LEAGUE GROUPS */
        .league-group {
            background: #1a2a2a;
            border-radius: 20px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid #FFD70040;
        }

        .league-header {
            background: #0a1a1a;
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .league-name { color: #FFD700; font-weight: bold; font-size: 0.9rem; }
        .league-count { color: #aaa; font-size: 0.7rem; }

        .league-matches { padding: 10px; display: block; }
        .league-matches.collapsed { display: none; }

        /* MATCH CARD */
        .match-card {
            background: #0a1a1a;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #FFD70030;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #FFD700;
            font-size: 0.7rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .match-team {
            flex: 1;
            text-align: center;
        }
        .match-team-name { font-weight: bold; color: #FFFFFF; font-size: 0.85rem; }
        .match-score { font-size: 1rem; font-weight: bold; color: #00FF88; margin-top: 4px; }
        .match-vs { color: #FFD700; font-size: 0.8rem; font-weight: bold; }

        .bet-row { display: flex; gap: 8px; }
        .bet-team-btn {
            flex: 1;
            background: #0a1a1a;
            border: 1px solid #FFD700;
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
        }
        .bet-team-btn:active { background: #FFD700; transform: scale(0.97); }
        .bet-team-btn:active .bet-label { color: #000; }
        .bet-team-btn:active .bet-odds { color: #000; }
        .bet-label { font-size: 0.7rem; color: #FFD700; }
        .bet-odds { font-size: 1.1rem; font-weight: bold; color: #00FF88; }

        /* PARLAY SELECTION INDICATOR */
        .selected-for-parlay {
            background: #FFD700 !important;
            border-color: #FFD700 !important;
        }
        .selected-for-parlay .bet-label,
        .selected-for-parlay .bet-odds {
            color: #000 !important;
        }

        /* BOTTOM BAR */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a1a1a;
            border-top: 2px solid #FFD700;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .view-slip-btn {
            flex: 1;
            background: #FFD700;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            color: #000;
        }
        .view-history-btn {
            flex: 1;
            background: #1a2a2a;
            border: 1px solid #FFD700;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            color: #FFD700;
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a2a2a;
            border-radius: 28px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            border: 2px solid #FFD700;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-title {
            color: #FFD700;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .modal-close {
            background: #2a2a2a;
            border: none;
            padding: 10px;
            border-radius: 30px;
            color: white;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }

        /* SLIP ITEMS */
        .slip-item {
            background: #0a1a1a;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #FFD70040;
        }
        .slip-match { font-size: 0.8rem; font-weight: bold; color: #FFFFFF; }
        .slip-selection { font-size: 0.7rem; color: #FFD700; margin: 4px 0; }
        .slip-odds { font-size: 0.7rem; color: #00FF88; }

        .total-box {
            background: #0a1a1a;
            border-radius: 16px;
            padding: 12px;
            margin: 10px 0;
            text-align: center;
            border: 1px solid #FFD700;
        }
        .total-text { font-size: 0.9rem; color: #FFD700; }
        .total-amount { font-size: 1.2rem; font-weight: bold; color: #00FF88; }

        .confirm-bet-btn {
            width: 100%;
            background: #FFD700;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
            color: #000;
        }

        .history-item {
            background: #0a1a1a;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #FFD70040;
        }
        .history-date { color: #FFD700; font-size: 0.7rem; }
        .history-details { color: #FFFFFF; font-size: 0.8rem; margin: 5px 0; }
        .history-status { font-size: 0.7rem; font-weight: bold; }
        .history-status-won { color: #00FF88; }
        .history-status-lost { color: #FF6666; }
        .history-status-pending { color: #FFA500; }

        .api-status {
            background: #1a2a2a;
            padding: 8px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.8rem;
            color: #00FF88;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #0a1a1a;
            border: 1px solid #FFD700;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #FFD700;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            color: #000;
        }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #FFD700;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            color: #FFD700;
        }

        /* GOLD ADDRESS TEXT */
        .gold-address {
            color: #FFD700 !important;
            font-weight: bold;
            font-size: 0.8rem;
            word-break: break-all;
            background: #0a1a1a;
            padding: 12px;
            border-radius: 16px;
            border: 1px solid #FFD700;
        }

        @media (max-width: 700px) {
            .match-teams { flex-direction: column; gap: 8px; }
            .match-vs { display: none; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>⚽ SOCCER BET</h1><div style="font-size:0.55rem; color:#FFD700;">USDT • Single • Parlay</div></div>
        <div id="authSection"><div class="auth-buttons"><button class="auth-btn" id="showLoginBtn">Login</button><button class="auth-btn" id="showSignupBtn">Sign Up</button></div></div>

    <div class="modal-content" style="text-align:center;">

        <div id="qrCode" style="display:flex; justify-content:center; margin:15px 0;"></div>

        <div class="modal-title">Withdraw USDT</div>
        <input type="text" id="withdrawAddress" class="input-field" placeholder="TRC-20 Wallet Address">
        <input type="number" id="withdrawAmount" class="input-field" placeholder="Amount (USDT)" min="10" step="10">
        <div id="withdrawMsg" style="color:#FF6666; font-size:0.7rem; margin-top:5px;"></div>
        <button id="submitWithdrawBtn" class="btn-primary">Request Withdrawal</button>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// ============================================================
// COMPLETE BETTING PLATFORM - SINGLE BET + PARLAY BUILDER
// ============================================================

let token = localStorage.getItem('authToken');
let currentUserId = null, currentUserBalance = 0, currentUsername = "";
let betMode = "single";  // "single" or "parlay"
let singleBet = null;     // For single bet mode
let parlayBets = [];      // For parlay mode
let realMatches = [], userBets = [];
let currentTab = "live";

// DOM
const balanceDisplay = document.getElementById('balanceDisplay');
const usernameDisplay = document.getElementById('usernameDisplay');
const matchesContainer = document.getElementById('matchesContainer');
const apiStatusDiv = document.getElementById('apiStatus');
const authSection = document.getElementById('authSection');
const userSection = document.getElementById('userSection');
const slipCountSpan = document.getElementById('slipCount');

// ============================================================
// AUTH & SESSION
// ============================================================
async function checkSession() {
    if (!token) return false;
    try {
        const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
            const user = await res.json();
            currentUserId = user.id;
            currentUserBalance = user.balance;
            currentUsername = user.username;
            updateBalanceUI();
            usernameDisplay.innerText = currentUsername;
            authSection.style.display = 'none';
            userSection.style.display = 'block';
            fetchLiveMatches();
            fetchUserBets();
            return true;
        } else {
            localStorage.removeItem('authToken');
            token = null;
            return false;
        }
    } catch(e) { return false; }
}

async function login(email, password) {
    try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (data.success) {
            token = data.token;
            localStorage.setItem('authToken', token);
            currentUserId = data.user.id;
            currentUserBalance = data.user.balance;
            currentUsername = data.user.username;
            updateBalanceUI();
            usernameDisplay.innerText = currentUsername;
            authSection.style.display = 'none';
            userSection.style.display = 'block';
            closeAuthModal();
            fetchLiveMatches();
            fetchUserBets();
            return true;
        } else { alert(data.error); return false; }
    } catch(e) { alert("Login error"); return false; }
}

async function signup(username, email, password, confirm, referral) {
    if (password !== confirm) { alert("Passwords do not match"); return false; }
    if (password.length < 6) { alert("Password must be at least 6 characters"); return false; }
    try {
        const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password, confirmPassword: confirm, referralCode: referral }) });
        const data = await res.json();
        if (data.success) {
            alert('Account created! Please login.');
            switchToLogin();
            return true;
        } else { alert(data.error); return false; }
    } catch(e) { alert("Signup error"); return false; }
}

function logout() {
    localStorage.removeItem('authToken');
    token = null;
    currentUserId = null;
    singleBet = null;
    parlayBets = [];
    updateSlipCount();
    authSection.style.display = 'block';
    userSection.style.display = 'none';
    matchesContainer.innerHTML = '<div class="loading">🔐 Please login</div>';
}

function updateBalanceUI() { balanceDisplay.innerText = currentUserBalance.toLocaleString() + " USDT"; }

// ============================================================
// BET MODE & SELECTION
// ============================================================
function setBetMode(mode) {
    betMode = mode;
    singleBet = null;
    parlayBets = [];
    updateSlipCount();
    document.querySelectorAll('.mode-tab').forEach(tab => {
        if (tab.dataset.mode === mode) tab.classList.add('active');
        else tab.classList.remove('active');
    });
    // Clear visual highlights
    document.querySelectorAll('.bet-team-btn').forEach(btn => {
        btn.classList.remove('selected-for-parlay');
    });
}

function selectBet(matchName, team, odds) {
    if (betMode === "single") {
        // Single bet - replace existing
        singleBet = { matchName, team, odds };
        updateSlipCount();
        // Highlight selected single bet
        document.querySelectorAll('.bet-team-btn').forEach(btn => {
            if (btn.dataset.matchName === matchName && btn.dataset.team === team) {
                btn.classList.add('selected-for-parlay');
            } else {
                btn.classList.remove('selected-for-parlay');
            }
        });
    } else {
        // Parlay mode - add to list
        const exists = parlayBets.some(b => b.matchName === matchName && b.team === team);
        if (exists) {
            parlayBets = parlayBets.filter(b => !(b.matchName === matchName && b.team === team));
        } else {
            parlayBets.push({ matchName, team, odds });
        }
        updateSlipCount();
        highlightParlaySelections();
    }
}

function highlightParlaySelections() {
    document.querySelectorAll('.bet-team-btn').forEach(btn => {
        const matchName = btn.dataset.matchName;
        const team = btn.dataset.team;
        const isSelected = parlayBets.some(b => b.matchName === matchName && b.team === team);
        if (isSelected) btn.classList.add('selected-for-parlay');
        else btn.classList.remove('selected-for-parlay');
    });
}

function updateSlipCount() {
    let count = 0;
    if (betMode === "single") count = singleBet ? 1 : 0;
    else count = parlayBets.length;
    slipCountSpan.innerText = count;
}

function calculateTotalOdds() {
    if (betMode === "single") return singleBet ? singleBet.odds : 1;
    else return parlayBets.reduce((total, bet) => total * bet.odds, 1);
}

function renderSlipModal() {
    const slipContainer = document.getElementById('slipItemsList');
    const totalOddsDiv = document.getElementById('totalOddsDisplay');
    const modalTitle = document.getElementById('slipModalTitle');
    
    modalTitle.innerText = betMode === "single" ? "🎯 SINGLE BET" : "📊 PARLAY BUILDER";
    
    let betsList = [];
    if (betMode === "single" && singleBet) betsList = [singleBet];
    else betsList = parlayBets;
    
    if (betsList.length === 0) {
        slipContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">No bets selected. Tap odds to add.</div>';
        totalOddsDiv.style.display = 'none';
        return;
    }
    
    slipContainer.innerHTML = betsList.map((bet, idx) => `
        <div class="slip-item">
            <div class="slip-match">${escapeHtml(bet.matchName)}</div>
            <div class="slip-selection">${escapeHtml(bet.team)} @ ${bet.odds.toFixed(2)}x</div>
            <button class="btn-secondary" style="margin-top:5px; padding:5px;" onclick="removeFromSlip(${idx})">Remove</button>
        </div>
    `).join('');
    
    const totalOdds = calculateTotalOdds();
    const stake = parseFloat(document.getElementById('betStakeInput').value) || 10;
    const potentialWin = stake * totalOdds;
    
    document.getElementById('totalOddsValue').innerHTML = `${totalOdds.toFixed(2)}x`;
    document.getElementById('totalStakeValue').innerHTML = `${stake} USDT`;
    document.getElementById('totalWinValue').innerHTML = `${potentialWin.toFixed(2)} USDT`;
    totalOddsDiv.style.display = 'block';
}

function removeFromSlip(index) {
    if (betMode === "single") {
        singleBet = null;
    } else {
        parlayBets.splice(index, 1);
    }
    updateSlipCount();
    renderSlipModal();
    if (betMode === "single") {
        document.querySelectorAll('.bet-team-btn').forEach(btn => btn.classList.remove('selected-for-parlay'));
    } else {
        highlightParlaySelections();
    }
}

// ============================================================
// PLACE BET
// ============================================================
async function placeBet() {
    if (!currentUserId) { alert("Login first"); return; }
    
    let betsList = [];
    if (betMode === "single") {
        if (!singleBet) { alert("No bet selected"); return; }
        betsList = [singleBet];
    } else {
        if (parlayBets.length === 0) { alert("No bets selected"); return; }
        betsList = parlayBets;
    }
    
    const stake = parseFloat(document.getElementById('betStakeInput').value) || 10;
    if (stake < 5) { alert("Minimum stake is 5 USDT"); return; }
    if (stake > currentUserBalance) { alert(`Insufficient balance! Need ${stake} USDT`); return; }
    
    const totalOdds = calculateTotalOdds();
    const potentialWin = stake * totalOdds;
    
    try {
        const res = await fetch('/api/place-bet', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({
                bets: betsList.map(b => ({ matchName: b.matchName, selection: b.team, odds: b.odds })),
                totalStake: stake,
                totalOdds: totalOdds
            })
        });
        const data = await res.json();
        if (data.success) {
            currentUserBalance = data.newBalance;
            updateBalanceUI();
            showReceipt(betsList, stake, totalOdds, potentialWin);
            // Clear slip
            if (betMode === "single") singleBet = null;
            else parlayBets = [];
            updateSlipCount();
            closeSlipModal();
            fetchUserBets();
            if (betMode === "single") {
                document.querySelectorAll('.bet-team-btn').forEach(btn => btn.classList.remove('selected-for-parlay'));
            } else {
                highlightParlaySelections();
            }
        } else {
            alert(data.error);
        }
    } catch(e) { alert("Error placing bet"); }
}

function showReceipt(bets, stake, odds, win) {
    const receiptContent = document.getElementById('receiptContent');
    receiptContent.innerHTML = `
        <div style="background:#0a1a1a; border-radius:16px; padding:15px; margin-bottom:10px;">
            <div style="color:#FFD700; font-weight:bold; margin-bottom:10px;">${betMode === "single" ? "SINGLE BET" : "PARLAY"}</div>
            ${bets.map(b => `<div style="margin-bottom:8px; padding:8px; background:#1a2a2a; border-radius:12px;">
                <div style="color:white;">${escapeHtml(b.matchName)}</div>
                <div style="color:#FFD700;">${escapeHtml(b.team)} @ ${b.odds.toFixed(2)}x</div>
            </div>`).join('')}
        </div>
        <div style="background:#0a1a1a; border-radius:16px; padding:15px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span style="color:#FFD700;">Total Odds:</span>
                <span style="color:#00FF88; font-weight:bold;">${odds.toFixed(2)}x</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span style="color:#FFD700;">Stake:</span>
                <span style="color:#00FF88; font-weight:bold;">${stake} USDT</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span style="color:#FFD700;">Potential Win:</span>
                <span style="color:#00FF88; font-weight:bold;">${win.toFixed(2)} USDT</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span style="color:#FFD700;">New Balance:</span>
                <span style="color:#00FF88; font-weight:bold;">${currentUserBalance.toFixed(2)} USDT</span>
            </div>
        </div>
        <div style="text-align:center; color:#FFD700; font-size:0.7rem;">Bet placed! Good luck!</div>
    `;
    document.getElementById('receiptModal').style.display = 'flex';
}

// ============================================================
// FETCH MATCHES
// ============================================================
async function fetchLiveMatches() {
    if (!currentUserId) return;
    apiStatusDiv.innerHTML = "🔄 Fetching...";
    try {
        const res = await fetch('/api/livescores');
        const data = await res.json();
        if (!data || !data.data || data.data.length === 0) {
            apiStatusDiv.innerHTML = "⚠️ No live matches";
            matchesContainer.innerHTML = '<div style="text-align:center; padding:30px; color:#aaa;">⚽ No matches</div>';
            return;
        }
        realMatches = data.data.map(m => ({
            id: m.matchId, league: m.leagueName || "Football",
            home: m.homeTeamName || m.homeTeam || "Home", away: m.awayTeamName || m.awayTeam || "Away",
            homeScore: m.homeScore || 0, awayScore: m.awayScore || 0,
            odds: { home: 2.00, draw: 3.20, away: 3.50 }
        }));
        apiStatusDiv.innerHTML = `✅ ${realMatches.length} matches`;
        renderMatches();
    } catch(e) { apiStatusDiv.innerHTML = "❌ Error"; }
}

function renderMatches() {
    let filtered = realMatches;
    if(currentTab === 'live') filtered = realMatches;
    else if(currentTab === 'early') filtered = realMatches.slice(0, 5);
    const leagues = {};
    filtered.forEach(m => { if(!leagues[m.league]) leagues[m.league] = []; leagues[m.league].push(m); });
    
    matchesContainer.innerHTML = Object.keys(leagues).map(leagueName => `
        <div class="league-group">
            <div class="league-header" data-league="${leagueName.replace(/ /g, '_')}">
                <span class="league-name">🏆 ${leagueName}</span>
                <span class="league-count">${leagues[leagueName].length} matches</span>
            </div>
            <div class="league-matches collapsed" id="league_${leagueName.replace(/ /g, '_')}">
                ${leagues[leagueName].map(m => `
                    <div class="match-card">
                        <div class="match-header"><span>🔴 ${currentTab === 'live' ? 'LIVE' : (currentTab === 'early' ? 'EARLY' : 'TODAY')}</span><span>${m.homeScore} - ${m.awayScore}</span></div>
                        <div class="match-teams">
                            <div class="match-team"><div class="match-team-name">${escapeHtml(m.home)}</div><div class="match-score">${m.homeScore}</div><button class="bet-team-btn" data-match-name="${escapeHtml(m.home)} vs ${escapeHtml(m.away)}" data-team="${escapeHtml(m.home)}" data-odds="${m.odds.home}">HOME ${m.odds.home.toFixed(2)}</button></div>
                            <div class="match-vs">VS</div>
                            <div class="match-team"><div class="match-team-name">${escapeHtml(m.away)}</div><div class="match-score">${m.awayScore}</div><button class="bet-team-btn" data-match-name="${escapeHtml(m.home)} vs ${escapeHtml(m.away)}" data-team="${escapeHtml(m.away)}" data-odds="${m.odds.away}">AWAY ${m.odds.away.toFixed(2)}</button></div>
                        </div>
                        <div class="bet-row"><button class="bet-team-btn" data-match-name="${escapeHtml(m.home)} vs ${escapeHtml(m.away)}" data-team="Draw" data-odds="${m.odds.draw}">DRAW ${m.odds.draw.toFixed(2)}</button></div>
                    </div>
                `).join('')}
            </div>
        </div>
    `).join('');
    
    document.querySelectorAll('.league-header').forEach(h => {
        h.addEventListener('click', () => {
            const id = h.dataset.league;
            const div = document.getElementById(`league_${id}`);
            if(div) div.classList.toggle('collapsed');
        });
    });
    
    document.querySelectorAll('.bet-team-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const matchName = btn.dataset.matchName;
            const team = btn.dataset.team;
            const odds = parseFloat(btn.dataset.odds);
            selectBet(matchName, team, odds);
        });
    });
}

// ============================================================
// HISTORY
// ============================================================
async function fetchUserBets() {
    if(!currentUserId || !token) return;
    try {
        const res = await fetch('/api/user-bets', { headers: { 'Authorization': `Bearer ${token}` } });
        const bets = await res.json();
        userBets = bets;
    } catch(e) {}
}

function showHistory() {
    if (!userBets.length) {
        document.getElementById('historyList').innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">No bets yet</div>';
    } else {
        document.getElementById('historyList').innerHTML = userBets.slice().reverse().map(b => `
            <div class="history-item">
                <div class="history-date">${new Date(b.timestamp).toLocaleString()}</div>
                <div class="history-details">Stake: ${b.totalStake.toFixed(2)} USDT | Odds: ${b.totalOdds.toFixed(2)}x</div>
                <div class="history-details">Potential Win: ${b.potentialWin.toFixed(2)} USDT</div>
                <div class="history-status history-status-${b.status || 'pending'}">Status: ${b.status || 'Pending'}</div>
                <div style="font-size:0.65rem; color:#aaa; margin-top:5px;">${b.selections?.map(s => `${s.selection}`).join(' | ')}</div>
            </div>
        `).join('');
    }
    document.getElementById('historyModal').style.display = 'flex';
}

// MODAL CONTROLS
// ============================================================

function closeSlipModal() { document.getElementById('slipModal').style.display = 'none'; }
function closeReceiptModal() { document.getElementById('receiptModal').style.display = 'none'; }
function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }

// Auth Modal
let isLoginMode = true;
function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
function switchToLogin() {
    isLoginMode = true;
    document.getElementById('authTitle').innerText = 'Login';
    document.getElementById('loginFields').style.display = 'block';
    document.getElementById('signupFields').style.display = 'none';
    document.getElementById('switchAuthModeBtn').innerText = "Don't have account? Sign up";
}
function switchToSignup() {
    isLoginMode = false;
    document.getElementById('authTitle').innerText = 'Sign Up';
    document.getElementById('loginFields').style.display = 'none';
    document.getElementById('signupFields').style.display = 'block';
    document.getElementById('switchAuthModeBtn').innerText = 'Already have account? Login';
}

// Deposit Modal
function openDepositModal() {
    document.getElementById('depositModal').style.display = 'flex';
    setTimeout(() => {
        if (typeof QRCode !== 'undefined') {
            document.getElementById('qrCode').innerHTML = '';
            new QRCode(document.getElementById('qrCode'), { text: 'TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg', width: 180, height: 180 });
        }
    }, 100);
}
function closeDepositModal() { document.getElementById('depositModal').style.display = 'none'; }

function openWithdrawModal() { document.getElementById('withdrawModal').style.display = 'flex'; }
function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }

// EVENT LISTENERS
// ============================================================
document.getElementById('viewSlipBtn')?.addEventListener('click', openSlipModal);
document.getElementById('viewHistoryBtn')?.addEventListener('click', showHistory);
document.getElementById('confirmBetBtn')?.addEventListener('click', placeBet);
document.getElementById('clearSlipBtn')?.addEventListener('click', () => { 
    if (betMode === "single") singleBet = null;
    else parlayBets = [];
    updateSlipCount(); 
    renderSlipModal(); 
    if (betMode === "single") document.querySelectorAll('.bet-team-btn').forEach(btn => btn.classList.remove('selected-for-parlay'));
    else highlightParlaySelections();
});
document.getElementById('betStakeInput')?.addEventListener('input', () => { if(document.getElementById('slipModal').style.display === 'flex') renderSlipModal(); });

document.querySelectorAll('.mode-tab').forEach(tab => {

});

// Sport tabs
document.querySelectorAll('.sport-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.sport-tab').forEach(t=>t.classList.remove('active'));

        currentTab = tab.dataset.tab;
        renderMatches();
    });
});

// Auth
document.getElementById('showLoginBtn')?.addEventListener('click', () => { switchToLogin(); openAuthModal(); });
document.getElementById('showSignupBtn')?.addEventListener('click', () => { switchToSignup(); openAuthModal(); });
document.getElementById('switchAuthModeBtn')?.addEventListener('click', () => { if (isLoginMode) switchToSignup(); else switchToLogin(); });
document.getElementById('doLoginBtn')?.addEventListener('click', () => { const email = document.getElementById('loginEmail').value; const pwd = document.getElementById('loginPassword').value; login(email, pwd); });
document.getElementById('doSignupBtn')?.addEventListener('click', () => {
    const u = document.getElementById('signupUsername').value;
    const e = document.getElementById('signupEmail').value;
    const p = document.getElementById('signupPassword').value;
    const c = document.getElementById('signupConfirmPassword').value;
    const r = document.getElementById('signupReferral').value;
    signup(u, e, p, c, r);
});
document.getElementById('closeAuthModalBtn')?.addEventListener('click', closeAuthModal);
document.getElementById('depositBtn')?.addEventListener('click', openDepositModal);
document.getElementById('closeDepositModalBtn')?.addEventListener('click', closeDepositModal);
document.getElementById('copyDepositAddrBtn')?.addEventListener('click', () => { navigator.clipboard.writeText('TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg'); alert('Address copied!'); });
document.getElementById('withdrawBtn')?.addEventListener('click', openWithdrawModal);
document.getElementById('closeWithdrawModalBtn')?.addEventListener('click', closeWithdrawModal);
document.getElementById('submitWithdrawBtn')?.addEventListener('click', async () => {
    const addr = document.getElementById('withdrawAddress').value.trim();
    const amount = parseFloat(document.getElementById('withdrawAmount').value);
    if (!addr) { document.getElementById('withdrawMsg').innerText = 'Enter address'; return; }
    if (isNaN(amount) || amount < 10) { document.getElementById('withdrawMsg').innerText = 'Minimum 10 USDT'; return; }
    if (amount > currentUserBalance) { document.getElementById('withdrawMsg').innerText = 'Insufficient balance'; return; }
    const res = await fetch('/api/withdraw-request', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ amount, walletAddress: addr }) });
    const data = await res.json();
    if (data.success) { alert('Withdrawal request submitted!'); closeWithdrawModal(); }
    else { alert(data.error); }
});
document.getElementById('logoutBtn')?.addEventListener('click', logout);

function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;':(m==='<'?'&lt;':'&gt;')); }

// Global functions for modal closes
window.closeSlipModal = closeSlipModal;
window.closeReceiptModal = closeReceiptModal;
window.closeHistoryModal = closeHistoryModal;
window.closeAuthModal = closeAuthModal;
window.removeFromSlip = removeFromSlip;

// Initialize
setBetMode("single");
checkSession();
