<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>iSPORTS LIVE | Real Scores & Odds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a1f1c 0%, #0b2b25 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #ffd70040;
        }

        .logo h1 {
            background: linear-gradient(135deg, #ffe1a0, #f3b33d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #0f2a24;
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid #ffd700;
        }

        .username {
            color: #ffd700;
            font-weight: bold;
        }

        .balance-card {
            background: #0f2a24;
            padding: 8px 24px;
            border-radius: 60px;
            border: 1px solid #ffd700;
            text-align: center;
        }

        .balance-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd700;
        }

        .logout-btn {
            background: #3a1a1a;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            color: #ffaaaa;
            cursor: pointer;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .auth-btn {
            background: #ffd700;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .api-status {
            background: #1a1a2e;
            padding: 10px 20px;
            border-radius: 40px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.8rem;
        }

        .api-status.success {
            background: #0a3a2a;
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .api-status.error {
            background: #3a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
        }

        .api-status.loading {
            background: #2a2a1a;
            color: #ffd700;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .match-card {
            background: #14141f;
            border-radius: 24px;
            padding: 16px;
            border: 1px solid #ffd70040;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #ffd700;
            font-size: 0.7rem;
        }

        .teams {
            text-align: center;
            padding: 15px 0;
        }

        .team {
            font-size: 1rem;
            font-weight: bold;
            color: white;
        }

        .vs {
            color: #ffd700;
            margin: 8px 0;
        }

        .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
            margin: 10px 0;
        }

        .odds-row {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .odd-btn {
            flex: 1;
            background: #0a0a10;
            border-radius: 20px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #2a2a35;
        }

        .odd-btn:hover {
            background: #2a2a35;
            border-color: #ffd700;
        }

        .odd-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
        }

        .bet-slip {
            background: #14141f;
            border-radius: 28px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #ffd70040;
        }

        .slip-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ffd70040;
        }

        .slip-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .clear-btn {
            background: #2a2a2a;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            color: #ddd;
            cursor: pointer;
        }

        .slip-items {
            max-height: 300px;
            overflow-y: auto;
        }

        .slip-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a10;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stake-input {
            width: 80px;
            background: #0a0a10;
            border: 1px solid #ffd700;
            border-radius: 30px;
            padding: 8px;
            text-align: center;
            color: #ffd700;
        }

        .remove-btn {
            background: #3a1a1a;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 16px;
            color: #ff6666;
            cursor: pointer;
        }

        .place-bet-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffd700, #f3a81d);
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #aaa;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #14141f;
            padding: 30px;
            border-radius: 28px;
            max-width: 400px;
            width: 90%;
            border: 1px solid #ffd700;
        }

        .modal-content h2 {
            color: #ffd700;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            background: #0a0a10;
            border: 1px solid #ffd700;
            border-radius: 30px;
            color: white;
            font-size: 1rem;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: #ffd700;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        .modal-switch {
            width: 100%;
            margin-top: 10px;
            background: transparent;
            border: none;
            color: #ffd700;
            cursor: pointer;
            padding: 8px;
        }

        .modal-close {
            width: 100%;
            margin-top: 10px;
            background: #2a2a2a;
            border: none;
            border-radius: 30px;
            padding: 10px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1>⚡ iSPORTS LIVE</h1>
            <div style="font-size: 0.65rem;">Real Live Scores • Betting Odds</div>
        </div>
        <div id="authSection">
            <div class="auth-buttons">
                <button class="auth-btn" id="showLoginBtn">Login</button>
                <button class="auth-btn" id="showSignupBtn">Sign Up</button>
            </div>
        </div>
        <div id="userSection" style="display: none;">
            <div class="user-info">
                <span class="username" id="usernameDisplay"></span>
                <div class="balance-card">
                    <div class="balance-value" id="balanceDisplay">0</div>
                </div>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
    </div>

    <div id="apiStatus" class="api-status loading">🔄 Connecting to server...</div>

    <div id="matchesContainer" class="matches-grid">
        <div class="loading">📡 Fetching live matches...</div>
    </div>

    <div class="bet-slip">
        <div class="slip-header">
            <div class="slip-title">📋 BET SLIP</div>
            <button class="clear-btn" id="clearSlipBtn">Clear</button>
        </div>
        <div id="slipItems" class="slip-items">
            <div style="text-align: center; padding: 20px; color: #aaa;">Tap odds to add bets</div>
        </div>
        <div id="totalDisplay" style="display: none;"></div>
        <button class="place-bet-btn" id="placeBetBtn">✔️ PLACE BETS</button>
    </div>
</div>

<!-- Login/Signup Modal -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Login</h2>
        <input type="email" id="authEmail" class="modal-input" placeholder="Email">
        <input type="text" id="authUsername" class="modal-input" placeholder="Username" style="display: none;">
        <input type="password" id="authPassword" class="modal-input" placeholder="Password">
        <button id="authSubmitBtn" class="modal-btn">Login</button>
        <button id="switchAuthBtn" class="modal-switch">Don't have an account? Sign up</button>
        <button id="closeAuthBtn" class="modal-close">Close</button>
    </div>
</div>

<script>
// ============================================================
// COMPLETE INDEX.HTML WITH LOGIN/SIGNUP
// ============================================================

// ============================================================
// USER AUTH STATE
// ============================================================
let currentUserId = null;
let currentUserBalance = 0;
let currentUsername = "";

let bettingSlip = [];
let realMatches = [];

// DOM Elements
const balanceDisplay = document.getElementById('balanceDisplay');
const usernameDisplay = document.getElementById('usernameDisplay');
const matchesContainer = document.getElementById('matchesContainer');
const apiStatusDiv = document.getElementById('apiStatus');
const slipItemsDiv = document.getElementById('slipItems');
const totalDisplayDiv = document.getElementById('totalDisplay');
const authSection = document.getElementById('authSection');
const userSection = document.getElementById('userSection');

// ============================================================
// AUTH FUNCTIONS
// ============================================================
async function login(email, password) {
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        
        if (data.success) {
            currentUserId = data.user.id;
            currentUserBalance = data.user.balance;
            currentUsername = data.user.username;
            
            updateBalanceUI();
            usernameDisplay.innerText = currentUsername;
            
            authSection.style.display = 'none';
            userSection.style.display = 'block';
            
            document.getElementById('authModal').style.display = 'none';
            
            // Clear modal inputs
            document.getElementById('authEmail').value = '';
            document.getElementById('authPassword').value = '';
            
            fetchLiveMatches();
            return true;
        } else {
            alert(data.error);
            return false;
        }
    } catch (error) {
        alert("Login error: " + error.message);
        return false;
    }
}

async function signup(username, email, password) {
    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });
        const data = await response.json();
        
        if (data.success) {
            alert('Account created successfully! Please login.');
            switchToLogin();
            return true;
        } else {
            alert(data.error);
            return false;
        }
    } catch (error) {
        alert("Signup error: " + error.message);
        return false;
    }
}

async function logout() {
    currentUserId = null;
    currentUserBalance = 0;
    currentUsername = "";
    
    authSection.style.display = 'block';
    userSection.style.display = 'none';
    
    bettingSlip = [];
    renderSlip();
    
    // Clear matches
    matchesContainer.innerHTML = '<div class="loading">🔐 Please login to see matches</div>';
    apiStatusDiv.className = "api-status loading";
    apiStatusDiv.innerHTML = "🔐 Login to fetch live matches";
}

function updateBalanceUI() {
    balanceDisplay.innerText = currentUserBalance.toLocaleString();
}

// ============================================================
// MODAL HANDLERS
// ============================================================
let isLoginMode = true;

function switchToLogin() {
    isLoginMode = true;
    document.getElementById('modalTitle').innerText = 'Login';
    document.getElementById('authUsername').style.display = 'none';
    document.getElementById('authSubmitBtn').innerText = 'Login';
    document.getElementById('switchAuthBtn').innerText = "Don't have an account? Sign up";
}

function switchToSignup() {
    isLoginMode = false;
    document.getElementById('modalTitle').innerText = 'Sign Up';
    document.getElementById('authUsername').style.display = 'block';
    document.getElementById('authSubmitBtn').innerText = 'Sign Up';
    document.getElementById('switchAuthBtn').innerText = 'Already have an account? Login';
}

document.getElementById('showLoginBtn').addEventListener('click', () => {
    switchToLogin();
    document.getElementById('authModal').style.display = 'flex';
});

document.getElementById('showSignupBtn').addEventListener('click', () => {
    switchToSignup();
    document.getElementById('authModal').style.display = 'flex';
});

document.getElementById('switchAuthBtn').addEventListener('click', () => {
    if (isLoginMode) {
        switchToSignup();
    } else {
        switchToLogin();
    }
});

document.getElementById('authSubmitBtn').addEventListener('click', async () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    
    if (isLoginMode) {
        await login(email, password);
    } else {
        const username = document.getElementById('authUsername').value.trim();
        if (!username) {
            alert("Username required");
            return;
        }
        await signup(username, email, password);
    }
});

document.getElementById('closeAuthBtn').addEventListener('click', () => {
    document.getElementById('authModal').style.display = 'none';
});

document.getElementById('logoutBtn').addEventListener('click', logout);

// ============================================================
// FETCH LIVE MATCHES FROM BACKEND
// ============================================================
async function fetchLiveMatches() {
    if (!currentUserId) return;
    
    apiStatusDiv.className = "api-status loading";
    apiStatusDiv.innerHTML = "🔄 Fetching live matches...";
    matchesContainer.innerHTML = '<div class="loading">📡 Connecting to server...</div>';

    try {
        const response = await fetch('/api/livescores');
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        
        if (!data || !data.data || data.data.length === 0) {
            apiStatusDiv.className = "api-status error";
            apiStatusDiv.innerHTML = "⚠️ No live matches at the moment. Try again later.";
            matchesContainer.innerHTML = '<div class="loading">⚽ No live matches right now.</div>';
            return;
        }

        realMatches = data.data.map(match => ({
            id: match.matchId,
            league: match.leagueName || "Football",
            home: match.homeTeamName || "Home Team",
            away: match.awayTeamName || "Away Team",
            homeScore: match.homeScore || 0,
            awayScore: match.awayScore || 0,
            status: match.status || "live",
            odds: {
                home: 2.00,
                draw: 3.20,
                away: 3.50
            }
        }));

        apiStatusDiv.className = "api-status success";
        apiStatusDiv.innerHTML = `✅ Connected • ${realMatches.length} live matches`;
        
        renderMatches();

    } catch (error) {
        console.error("Error:", error);
        apiStatusDiv.className = "api-status error";
        apiStatusDiv.innerHTML = `❌ Error: ${error.message}`;
        matchesContainer.innerHTML = `<div class="loading">❌ Failed to fetch matches</div>`;
    }
}

function renderMatches() {
    if (realMatches.length === 0) return;
    
    matchesContainer.innerHTML = realMatches.map(match => `
        <div class="match-card">
            <div class="match-header">
                <span>🏆 ${escapeHtml(match.league)}</span>
                <span>🔴 LIVE</span>
            </div>
            <div class="teams">
                <div class="team">${escapeHtml(match.home)}</div>
                <div class="score">${match.homeScore} - ${match.awayScore}</div>
                <div class="team">${escapeHtml(match.away)}</div>
                <div class="vs">VS</div>
            </div>
            <div class="odds-row">
                <div class="odd-btn" data-match='${JSON.stringify({matchName:`${match.home} vs ${match.away}`, selection:match.home, odds:match.odds.home})}'>
                    <div class="odd-price">${match.odds.home.toFixed(2)}</div>
                    <div>HOME</div>
                </div>
                <div class="odd-btn" data-match='${JSON.stringify({matchName:`${match.home} vs ${match.away}`, selection:"Draw", odds:match.odds.draw})}'>
                    <div class="odd-price">${match.odds.draw.toFixed(2)}</div>
                    <div>DRAW</div>
                </div>
                <div class="odd-btn" data-match='${JSON.stringify({matchName:`${match.home} vs ${match.away}`, selection:match.away, odds:match.odds.away})}'>
                    <div class="odd-price">${match.odds.away.toFixed(2)}</div>
                    <div>AWAY</div>
                </div>
            </div>
        </div>
    `).join('');
    
    document.querySelectorAll('.odd-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const data = JSON.parse(btn.dataset.match);
            addToSlip(data);
        });
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ============================================================
// BET SLIP FUNCTIONS
// ============================================================
function addToSlip(bet) {
    const existingIndex = bettingSlip.findIndex(b => b.matchName === bet.matchName && b.selection === bet.selection);
    if (existingIndex !== -1) {
        bettingSlip[existingIndex].stake += 10;
    } else {
        bettingSlip.push({
            id: Date.now(),
            matchName: bet.matchName,
            selection: bet.selection,
            odds: bet.odds,
            stake: 10
        });
    }
    renderSlip();
}

function renderSlip() {
    if (bettingSlip.length === 0) {
        slipItemsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #aaa;">Tap odds to add bets</div>';
        totalDisplayDiv.style.display = 'none';
        return;
    }
    
    let totalStake = 0;
    let totalOdds = 1;
    
    slipItemsDiv.innerHTML = bettingSlip.map((bet, idx) => {
        totalStake += bet.stake;
        totalOdds *= bet.odds;
        return `
            <div class="slip-item">
                <div style="flex: 2; font-size: 0.8rem;">
                    <strong>${escapeHtml(bet.matchName)}</strong><br>
                    ${escapeHtml(bet.selection)} @ ${bet.odds.toFixed(2)}
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="number" value="${bet.stake}" class="stake-input" data-idx="${idx}" step="5" min="5">
                    <button class="remove-btn" data-idx="${idx}">✖</button>
                </div>
            </div>
        `;
    }).join('');
    
    totalDisplayDiv.style.display = 'block';
    totalDisplayDiv.innerHTML = `
        <div style="background: #0a0a10; border-radius: 16px; padding: 12px; margin-top: 10px;">
            <div>💰 Total Stake: ${totalStake.toFixed(2)} USDT</div>
            <div>📊 Parlay Odds: ${totalOdds.toFixed(2)}x</div>
            <div>🎯 Potential Win: ${(totalStake * totalOdds).toFixed(2)} USDT</div>
        </div>
    `;
    
    document.querySelectorAll('.stake-input').forEach(input => {
        input.addEventListener('change', (e) => {
            const idx = parseInt(input.dataset.idx);
            let newStake = parseFloat(input.value);
            if (isNaN(newStake) || newStake < 5) newStake = 5;
            bettingSlip[idx].stake = newStake;
            renderSlip();
        });
    });
    
    document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const idx = parseInt(btn.dataset.idx);
            bettingSlip.splice(idx, 1);
            renderSlip();
        });
    });
}

async function placeBets() {
    if (!currentUserId) {
        alert("Please login first!");
        return;
    }
    
    if (bettingSlip.length === 0) {
        alert("No bets selected!");
        return;
    }
    
    let totalStake = bettingSlip.reduce((sum, b) => sum + b.stake, 0);
    if (totalStake > currentUserBalance) {
        alert(`Insufficient balance! Need ${totalStake} USDT, have ${currentUserBalance.toFixed(2)} USDT`);
        return;
    }
    
    let totalOdds = bettingSlip.reduce((prod, b) => prod * b.odds, 1);
    let potentialWin = totalStake * totalOdds;
    
    // Send bet to backend
    try {
        const response = await fetch('/api/place-bet', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: currentUserId,
                bets: bettingSlip.map(b => ({ matchName: b.matchName, selection: b.selection, odds: b.odds })),
                totalStake: totalStake,
                totalOdds: totalOdds
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            currentUserBalance = data.newBalance;
            updateBalanceUI();
            
            alert(`✅ Bets placed!\nStake: ${totalStake.toFixed(2)} USDT\nParlay Odds: ${totalOdds.toFixed(2)}x\nPotential Win: ${potentialWin.toFixed(2)} USDT`);
            
            bettingSlip = [];
            renderSlip();
        } else {
            alert(data.error);
        }
    } catch (error) {
        alert("Error placing bet: " + error.message);
    }
}

// Event Listeners
document.getElementById('clearSlipBtn').addEventListener('click', () => {
    bettingSlip = [];
    renderSlip();
});

document.getElementById('placeBetBtn').addEventListener('click', placeBets);

// Check for existing session (simplified - in production use token)
// For now, user must login each time

console.log("✅ Frontend ready - Login to start betting");
</script>
</body>
</html>
