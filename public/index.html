<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>⚡ SOCCER BET | Live Odds | Asian Handicap | Over/Under</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a2a1f 0%, #0b3b25 100%);
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 12px 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #FFD700;
        }

        .logo h1 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.2rem;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0a1a1a;
            padding: 5px 12px;
            border-radius: 50px;
            border: 1px solid #FFD700;
        }

        .username { color: #FFD700; font-size: 0.8rem; font-weight: bold; }
        .balance-value { font-size: 1rem; font-weight: bold; color: #00FF88; }
        .menu-btn {
            background: #1a1a2e;
            border: 1px solid #FFD700;
            padding: 4px 12px;
            border-radius: 30px;
            color: #FFD700;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .bet-mode-tabs, .sport-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.4);
            padding: 5px;
            border-radius: 50px;
        }
        .mode-tab, .sport-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 40px;
            background: transparent;
            color: #ccc;
            font-weight: bold;
            cursor: pointer;
        }
        .mode-tab.active, .sport-tab.active {
            background: #FFD700;
            color: #000;
        }

        .match-card {
            background: #0a1a1a;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #FFD70030;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #FFD700;
            font-size: 0.7rem;
        }

        .match-teams {
            text-align: center;
            margin-bottom: 15px;
        }
        .team-name { font-weight: bold; color: white; font-size: 1rem; }
        .vs { color: #FFD700; margin: 5px 0; }
        .score { font-size: 1.2rem; font-weight: bold; color: #00FF88; margin-top: 5px; }

        .market-title {
            font-size: 0.65rem;
            color: #FFA500;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        .bet-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .bet-btn {
            flex: 1;
            min-width: 70px;
            background: #0a0a10;
            border: 1px solid #FFD70040;
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
        }
        .bet-btn:active { background: #FFD700; transform: scale(0.97); }
        .bet-label { font-size: 0.6rem; color: #FFD700; }
        .bet-value { font-size: 0.85rem; font-weight: bold; color: #00FF88; }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a1a1a;
            border-top: 2px solid #FFD700;
            padding: 12px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .bottom-btn {
            flex: 1;
            background: #1a2a2a;
            border: 1px solid #FFD700;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            color: #FFD700;
            text-align: center;
        }

        .api-status {
            background: #1a2a2a;
            padding: 8px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.7rem;
            color: #00FF88;
        }

        /* Modal Styles - Your Original Layout */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a2a2a;
            border-radius: 28px;
            padding: 25px;
            width: 90%;
            max-width: 380px;
            border: 2px solid #FFD700;
        }
        .modal-title {
            color: #FFD700;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #0a1a1a;
            border: 1px solid #FFD700;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #FFD700;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            color: #000;
        }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #FFD700;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            color: #FFD700;
        }

        @media (max-width: 700px) {
            .bet-row { flex-direction: column; }
            .bet-btn { min-width: auto; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>⚡ SOCCER BET</h1><div style="font-size:0.55rem;">Asian Handicap • Over/Under</div></div>
        <div id="authSection"><div class="user-menu"><button class="menu-btn" id="showLoginBtn">Login</button><button class="menu-btn" id="showSignupBtn">Sign Up</button></div></div>
        <div id="userSection" style="display:none;"><div class="user-menu"><span class="username" id="usernameDisplay"></span><span class="balance-value" id="balanceDisplay">0</span><button class="menu-btn" id="depositBtn">💰</button><button class="menu-btn" id="withdrawBtn">💸</button><button class="menu-btn logout-btn" id="logoutBtn">Exit</button></div></div>
    </div>

    <div id="apiStatus" class="api-status">🔄 Loading live matches...</div>

    <div class="bet-mode-tabs">
        <button class="mode-tab active" data-mode="single">🎯 SINGLE BET</button>
        <button class="mode-tab" data-mode="parlay">📊 PARLAY</button>
    </div>

    <div class="sport-tabs">
        <button class="sport-tab active" data-tab="live">🔴 LIVE</button>
        <button class="sport-tab" data-tab="today">📅 TODAY</button>

    <div id="matchesContainer"></div>

    <div class="bottom-bar">
        <button class="bottom-btn" id="viewSlipBtn">📋 SLIP (<span id="slipCount">0</span>)</button>
        <button class="bottom-btn" id="viewHistoryBtn">📜 HISTORY</button>
    </div>
</div>

<!-- BET SLIP MODAL -->
<div id="slipModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">📋 BET SLIP</div>
        <div id="slipList"></div>
        <div style="margin:10px 0; padding:10px; background:#0a1a1a; border-radius:16px;">
            <div>Parlay Odds: <span id="totalOdds">0x</span></div>
            <div>Stake: <input type="number" id="stakeInput" value="10" min="5" style="width:100px; background:#0a1a1a; border:1px solid #FFD700; border-radius:20px; padding:5px; color:#00FF88;"></div>
            <div>Potential Win: <span id="potentialWin">0</span> USDT</div>
        </div>
        <button id="confirmBetBtn" class="btn-primary">CONFIRM BET</button>
        <button id="clearSlipBtn" class="btn-secondary">Clear All</button>
        <button class="btn-secondary" onclick="closeSlipModal()">Close</button>
    </div>
</div>

<!-- HISTORY MODAL -->
<div id="historyModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">📜 BET HISTORY</div>
        <div id="historyList"></div>
        <button class="btn-secondary" onclick="closeHistoryModal()">Close</button>
    </div>
</div>

<!-- LOGIN MODAL -->
<div id="authModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">Login</div>
        <input type="email" id="loginEmail" class="input-field" placeholder="Email">
        <input type="password" id="loginPassword" class="input-field" placeholder="Password">
        <button id="doLoginBtn" class="btn-primary">Login</button>
        <button id="switchToSignupBtn" class="btn-secondary">Don't have an account? Sign Up</button>
        <button class="btn-secondary" onclick="closeAuthModal()">Close</button>
    </div>
</div>

<!-- SIGNUP MODAL -->
<div id="signupModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">Sign Up</div>
        <input type="text" id="signupUsername" class="input-field" placeholder="Username">
        <input type="email" id="signupEmail" class="input-field" placeholder="Email">
        <input type="password" id="signupPassword" class="input-field" placeholder="Password">
        <input type="password" id="signupConfirm" class="input-field" placeholder="Confirm Password">
        <input type="text" id="signupReferral" class="input-field" placeholder="Referral Code (optional)">
        <button id="doSignupBtn" class="btn-primary">Sign Up</button>
        <button class="btn-secondary" onclick="closeSignupModal()">Close</button>
    </div>
</div>

<!-- DEPOSIT MODAL -->
<div id="depositModal" class="modal-overlay">
    <div class="modal-content" style="text-align:center;">
        <div class="modal-title">Deposit USDT</div>
        <div id="qrCode" style="display:flex; justify-content:center; margin:15px 0;"></div>
        <div style="background:#0a1a1a; padding:12px; border-radius:16px; color:#FFD700; font-size:0.7rem;">TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg</div>
        <button id="copyDepositBtn" class="btn-primary">Copy Address</button>
        <button class="btn-secondary" onclick="closeDepositModal()">Close</button>
    </div>
</div>

<!-- WITHDRAW MODAL -->
<div id="withdrawModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">Withdraw USDT</div>
        <input type="text" id="withdrawAddress" class="input-field" placeholder="TRC-20 Wallet Address">
        <input type="number" id="withdrawAmount" class="input-field" placeholder="Amount (USDT)" min="10">
        <div id="withdrawMsg" style="color:#FF6666; font-size:0.7rem;"></div>
        <button id="submitWithdrawBtn" class="btn-primary">Request Withdrawal</button>
        <button class="btn-secondary" onclick="closeWithdrawModal()">Close</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// ============================================================
// COMPLETE WORKING VERSION - HANDICAP & OVER/UNDER
// ============================================================

let token = localStorage.getItem('authToken');
let currentUserId = null, currentBalance = 0, currentUsername = "";
let betMode = "single";
let singleBet = null;
let parlayBets = [];
let liveMatches = [];
let userBets = [];

const balanceDisplay = document.getElementById('balanceDisplay');
const usernameDisplay = document.getElementById('usernameDisplay');
const matchesContainer = document.getElementById('matchesContainer');
const apiStatus = document.getElementById('apiStatus');
const slipCount = document.getElementById('slipCount');

// ============================================================
// AUTH FUNCTIONS
// ============================================================
async function checkSession() {
    if (!token) return false;
    try {
        const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
            const user = await res.json();
            currentUserId = user.id;
            currentBalance = user.balance;
            currentUsername = user.username;
            balanceDisplay.innerText = currentBalance.toLocaleString() + " USDT";
            usernameDisplay.innerText = currentUsername;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('userSection').style.display = 'flex';
            fetchLiveMatches();
            fetchUserBets();
            return true;
        } else { localStorage.removeItem('authToken'); token = null; return false; }
    } catch(e) { return false; }
}

async function login(email, password) {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (data.success) {
        token = data.token; localStorage.setItem('authToken', token);
        currentUserId = data.user.id; currentBalance = data.user.balance; currentUsername = data.user.username;
        balanceDisplay.innerText = currentBalance.toLocaleString() + " USDT";
        usernameDisplay.innerText = currentUsername;
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('userSection').style.display = 'flex';
        closeAuthModal(); fetchLiveMatches(); fetchUserBets();
    } else { alert(data.error); }
}

async function signup(username, email, password, confirm, referral) {
    if (password !== confirm) { alert("Passwords do not match"); return; }
    const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password, confirmPassword: confirm, referralCode: referral }) });
    const data = await res.json();
    if (data.success) { alert('Account created! Please login.'); closeSignupModal(); openAuthModal(); }
    else { alert(data.error); }
}

function logout() {
    localStorage.removeItem('authToken'); token = null; currentUserId = null;
    singleBet = null; parlayBets = [];
    updateSlipCount();
    document.getElementById('authSection').style.display = 'flex';
    document.getElementById('userSection').style.display = 'none';
    matchesContainer.innerHTML = '<div style="text-align:center; padding:40px;">🔐 Please login</div>';
}

function updateSlipCount() { 
    let count = betMode === "single" ? (singleBet ? 1 : 0) : parlayBets.length;
    slipCount.innerText = count; 
}

// ============================================================
// FETCH LIVE MATCHES
// ============================================================
async function fetchLiveMatches() {
    if (!currentUserId) return;
    apiStatus.innerHTML = "🔄 Fetching live matches...";
    try {
        const res = await fetch('/api/live-scores');
        const data = await res.json();
        if (data && data.length > 0) {
            liveMatches = data;
            apiStatus.innerHTML = `✅ ${liveMatches.length} live matches`;
            renderMatches();
            for (const match of liveMatches) {
                fetchOddsForMatch(match.matchId);
            }
        } else {
            apiStatus.innerHTML = "⚠️ No live matches";
            matchesContainer.innerHTML = '<div style="text-align:center; padding:40px;">⚽ No live matches right now</div>';
        }
    } catch(e) { apiStatus.innerHTML = "❌ Error loading matches"; }
}

async function fetchOddsForMatch(matchId) {
    try {
        const res = await fetch(`/api/match-odds/${matchId}?companyId=31`);
        const data = await res.json();
        if (data && data.data && data.data[0]) {
            updateMatchOdds(matchId, data.data[0]);
        }
    } catch(e) { console.error("Error fetching odds:", e); }
}

function updateMatchOdds(matchId, odds) {
    const card = document.querySelector(`.match-card[data-id='${matchId}']`);
    if (!card) return;
    
    // Update 1X2 odds
    const homeEl = card.querySelector('.odds-home');
    const drawEl = card.querySelector('.odds-draw');
    const awayEl = card.querySelector('.odds-away');
    if (homeEl) homeEl.innerText = odds.odds_home?.toFixed(2) || '2.00';
    if (drawEl) drawEl.innerText = odds.odds_draw?.toFixed(2) || '3.20';
    if (awayEl) awayEl.innerText = odds.odds_away?.toFixed(2) || '3.50';
    
    // Update Asian Handicap - Check different possible field names
    let handicapData = odds.asian_handicap || odds.handicap || odds.spreads || [];
    if (handicapData && handicapData.length > 0) {
        const handicapContainer = card.querySelector('.handicap-container');
        if (handicapContainer) {
            handicapContainer.innerHTML = handicapData.slice(0, 4).map(h => `
                <div class="bet-btn" data-type="handicap" data-line="${h.line || h.handicap}" data-home="${h.home || h.home_odds}" data-away="${h.away || h.away_odds}">
                    <div class="bet-label">${h.line || h.handicap}</div>
                    <div class="bet-value">${(h.home || h.home_odds || 0).toFixed(2)} / ${(h.away || h.away_odds || 0).toFixed(2)}</div>
                </div>
            `).join('');
        }
    }
    
    // Update Over/Under - Check different possible field names
    let ouData = odds.over_under || odds.totals || odds.ou || [];
    if (ouData && ouData.length > 0) {
        const ouContainer = card.querySelector('.ou-container');
        if (ouContainer) {
            ouContainer.innerHTML = ouData.slice(0, 4).map(ou => `
                <div class="bet-btn" data-type="ou" data-line="${ou.line || ou.total}" data-over="${ou.over || ou.over_odds}" data-under="${ou.under || ou.under_odds}">
                    <div class="bet-label">${ou.line || ou.total}</div>
                    <div class="bet-value">O:${(ou.over || ou.over_odds || 0).toFixed(2)} U:${(ou.under || ou.under_odds || 0).toFixed(2)}</div>
                </div>
            `).join('');
        }
    }
}

function renderMatches() {
    matchesContainer.innerHTML = liveMatches.map(m => `
        <div class="match-card" data-id="${m.matchId}">
            <div class="match-header">
                <span>🏆 ${m.leagueName || "Football"}</span>
                <span>🔴 LIVE ${m.homeScore} - ${m.awayScore}</span>
            </div>
            <div class="match-teams">
                <div class="team-name">${escapeHtml(m.homeName)}</div>
                <div class="vs">VS</div>
                <div class="team-name">${escapeHtml(m.awayName)}</div>
                <div class="score">${m.homeScore} - ${m.awayScore}</div>
            </div>
            
            <div class="market-title">⚡ 1X2 (Moneyline)</div>
            <div class="bet-row">
                <div class="bet-btn" data-type="1x2" data-selection="home" data-odds="2.00" data-name="${escapeHtml(m.homeName)}">
                    <div class="bet-label">HOME</div>
                    <div class="bet-value odds-home">2.00</div>
                </div>
                <div class="bet-btn" data-type="1x2" data-selection="draw" data-odds="3.20">
                    <div class="bet-label">DRAW</div>
                    <div class="bet-value odds-draw">3.20</div>
                </div>
                <div class="bet-btn" data-type="1x2" data-selection="away" data-odds="3.50" data-name="${escapeHtml(m.awayName)}">
                    <div class="bet-label">AWAY</div>
                    <div class="bet-value odds-away">3.50</div>
                </div>
            </div>
            
            <div class="market-title">⚽ Asian Handicap</div>
            <div class="bet-row handicap-container">
                <div class="bet-btn"><div class="bet-label">Loading odds...</div></div>
            </div>
            
            <div class="market-title">📊 Over / Under</div>
            <div class="bet-row ou-container">
                <div class="bet-btn"><div class="bet-label">Loading odds...</div></div>
            </div>
        </div>
    `).join('');
    
    attachBetHandlers();
}

function attachBetHandlers() {
    document.querySelectorAll('.bet-btn[data-type="1x2"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const card = btn.closest('.match-card');
            const matchId = card.dataset.id;
            const match = liveMatches.find(m => m.matchId == matchId);
            if (!match) return;
            let selection = btn.dataset.selection === 'home' ? match.homeName : (btn.dataset.selection === 'away' ? match.awayName : 'Draw');
            let odds = parseFloat(btn.dataset.odds);
            selectBet(`${match.homeName} vs ${match.awayName}`, selection, odds);
        });
    });
}

function selectBet(matchName, selection, odds) {
    if (betMode === "single") {
        singleBet = { matchName, selection, odds };
        updateSlipCount();
    } else {
        const exists = parlayBets.some(b => b.matchName === matchName && b.selection === selection);
        if (exists) parlayBets = parlayBets.filter(b => !(b.matchName === matchName && b.selection === selection));
        else parlayBets.push({ matchName, selection, odds });
        updateSlipCount();
    }
}

function openSlipModal() {
    const container = document.getElementById('slipList');
    let bets = betMode === "single" ? (singleBet ? [singleBet] : []) : parlayBets;
    if (bets.length === 0) { alert("No bets selected"); return; }
    let totalOdds = 1;
    container.innerHTML = bets.map((b, i) => {
        totalOdds *= b.odds;
        return `<div style="background:#0a1a1a; padding:10px; margin-bottom:8px; border-radius:12px;">
            <div>${escapeHtml(b.matchName)}</div>
            <div style="color:#FFD700;">${escapeHtml(b.selection)} @ ${b.odds.toFixed(2)}x</div>
            <div>Stake: <input type="number" value="${b.stake || 10}" class="stake-input" data-idx="${i}" style="width:80px;"></div>
            <button onclick="removeFromSlip(${i})" style="background:#3a1a1a; border:none; padding:4px 8px; border-radius:20px;">Remove</button>
        </div>`;
    }).join('');
    document.getElementById('totalOdds').innerText = totalOdds.toFixed(2) + 'x';
    const stake = parseFloat(document.getElementById('stakeInput').value) || 10;
    document.getElementById('potentialWin').innerText = (stake * totalOdds).toFixed(2);
    document.getElementById('stakeInput').oninput = () => {
        let s = parseFloat(document.getElementById('stakeInput').value) || 10;
        document.getElementById('potentialWin').innerText = (s * totalOdds).toFixed(2);
    };
    document.getElementById('slipModal').style.display = 'flex';
    
    document.querySelectorAll('.stake-input').forEach(inp => {
        inp.addEventListener('change', (e) => {
            let idx = parseInt(inp.dataset.idx);
            if (betMode === "single") singleBet.stake = parseFloat(inp.value) || 10;
            else parlayBets[idx].stake = parseFloat(inp.value) || 10;
        });
    });
}

window.removeFromSlip = function(idx) {
    if (betMode === "single") singleBet = null;
    else parlayBets.splice(idx, 1);
    updateSlipCount();
    openSlipModal();
};

async function placeBet() {
    let bets = betMode === "single" ? (singleBet ? [singleBet] : []) : parlayBets;
    if (bets.length === 0) { alert("No bets selected"); return; }
    let totalStake = bets.reduce((s, b) => s + (b.stake || 10), 0);
    if (totalStake > currentBalance) { alert("Insufficient balance"); return; }
    let totalOdds = bets.reduce((p, b) => p * b.odds, 1);
    const res = await fetch('/api/place-bet', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ bets, totalStake, totalOdds }) });
    const data = await res.json();
    if (data.success) {
        currentBalance = data.newBalance;
        balanceDisplay.innerText = currentBalance.toLocaleString() + " USDT";
        alert(`✅ Bet placed! Stake: ${totalStake} USDT | Odds: ${totalOdds.toFixed(2)}x`);
        singleBet = null; parlayBets = [];
        updateSlipCount();
        closeSlipModal();
        fetchUserBets();
    } else { alert(data.error); }
}

async function fetchUserBets() {
    if (!token) return;
    const res = await fetch('/api/user-bets', { headers: { 'Authorization': `Bearer ${token}` } });
    const bets = await res.json();
    userBets = bets;
    if (bets.length) {
        document.getElementById('historyList').innerHTML = bets.slice().reverse().map(b => `
            <div style="background:#0a1a1a; border-radius:12px; padding:10px; margin-bottom:8px;">
                <div>${new Date(b.timestamp).toLocaleString()}</div>
                <div>Stake: ${b.totalStake} USDT | Odds: ${b.totalOdds.toFixed(2)}x</div>
                <div style="color:#FFA500;">Status: ${b.status || 'Pending'}</div>
            </div>
        `).join('');
    } else {
        document.getElementById('historyList').innerHTML = '<div style="text-align:center;">No bets yet</div>';
    }
}

function showHistory() { fetchUserBets(); document.getElementById('historyModal').style.display = 'flex'; }

// Modal functions
function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
function openSignupModal() { document.getElementById('signupModal').style.display = 'flex'; }
function closeSignupModal() { document.getElementById('signupModal').style.display = 'none'; }
function closeSlipModal() { document.getElementById('slipModal').style.display = 'none'; }
function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }
function closeDepositModal() { document.getElementById('depositModal').style.display = 'none'; }
function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }

function openDepositModal() {
    document.getElementById('depositModal').style.display = 'flex';
    setTimeout(() => {
        if (typeof QRCode !== 'undefined') {
            document.getElementById('qrCode').innerHTML = '';
            new QRCode(document.getElementById('qrCode'), { text: 'TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg', width: 180, height: 180 });
        }
    }, 100);
}
function openWithdrawModal() { document.getElementById('withdrawModal').style.display = 'flex'; }

// Event Listeners
document.getElementById('viewSlipBtn')?.addEventListener('click', openSlipModal);
document.getElementById('viewHistoryBtn')?.addEventListener('click', showHistory);
document.getElementById('confirmBetBtn')?.addEventListener('click', placeBet);
document.getElementById('clearSlipBtn')?.addEventListener('click', () => { singleBet = null; parlayBets = []; updateSlipCount(); closeSlipModal(); });
document.querySelectorAll('.mode-tab').forEach(tab => tab.addEventListener('click', () => {
    betMode = tab.dataset.mode;
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    singleBet = null; parlayBets = []; updateSlipCount();
}));
document.querySelectorAll('.sport-tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
}));
document.getElementById('showLoginBtn')?.addEventListener('click', openAuthModal);
document.getElementById('showSignupBtn')?.addEventListener('click', openSignupModal);
document.getElementById('switchToSignupBtn')?.addEventListener('click', () => { closeAuthModal(); openSignupModal(); });
document.getElementById('doLoginBtn')?.addEventListener('click', () => login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value));
document.getElementById('doSignupBtn')?.addEventListener('click', () => signup(document.getElementById('signupUsername').value, document.getElementById('signupEmail').value, document.getElementById('signupPassword').value, document.getElementById('signupConfirm').value, document.getElementById('signupReferral').value));
document.getElementById('depositBtn')?.addEventListener('click', openDepositModal);
document.getElementById('withdrawBtn')?.addEventListener('click', openWithdrawModal);
document.getElementById('copyDepositBtn')?.addEventListener('click', () => { navigator.clipboard.writeText('TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg'); alert('Address copied!'); });
document.getElementById('submitWithdrawBtn')?.addEventListener('click', async () => {
    const addr = document.getElementById('withdrawAddress').value;
    const amt = parseFloat(document.getElementById('withdrawAmount').value);
    if (!addr || amt < 10) { document.getElementById('withdrawMsg').innerText = 'Invalid'; return; }
    const res = await fetch('/api/withdraw-request', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ amount: amt, walletAddress: addr }) });
    const data = await res.json();
    if (data.success) { alert('Request submitted'); closeWithdrawModal(); }
    else alert(data.error);
});
document.getElementById('logoutBtn')?.addEventListener('click', logout);

function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }

// Global functions for modal buttons
window.closeSlipModal = closeSlipModal;
window.closeHistoryModal = closeHistoryModal;
window.closeAuthModal = closeAuthModal;
window.closeSignupModal = closeSignupModal;
window.closeDepositModal = closeDepositModal;
window.closeWithdrawModal = closeWithdrawModal;

checkSession();
</script>
</body>
</html>
