<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>⚡ SOCCER BET | Live Odds | Handicap | Over/Under</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0a2a1f 0%, #0b3b25 100%); min-height: 100vh; padding: 15px; padding-bottom: 100px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); border-radius: 28px; padding: 12px 16px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border: 1px solid #FFD700; }
        .logo h1 { background: linear-gradient(135deg, #FFD700, #FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.2rem; }
        .user-menu { display: flex; align-items: center; gap: 8px; background: #0a1a1a; padding: 5px 12px; border-radius: 50px; border: 1px solid #FFD700; }
        .username { color: #FFD700; font-size: 0.8rem; font-weight: bold; }
        .balance-value { font-size: 1rem; font-weight: bold; color: #00FF88; }
        .menu-btn { background: #1a1a2e; border: 1px solid #FFD700; padding: 4px 12px; border-radius: 30px; color: #FFD700; cursor: pointer; font-size: 0.7rem; }
        .bet-mode-tabs, .sport-tabs { display: flex; gap: 8px; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 50px; }
        .mode-tab, .sport-tab { flex: 1; text-align: center; padding: 10px; border-radius: 40px; background: transparent; color: #ccc; font-weight: bold; cursor: pointer; }
        .mode-tab.active, .sport-tab.active { background: #FFD700; color: #000; }
        .league-group { background: rgba(20,30,25,0.9); border-radius: 20px; margin-bottom: 12px; border: 1px solid #FFD70040; }
        .league-header { background: rgba(0,0,0,0.5); padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; }
        .league-name { color: #FFD700; font-weight: bold; }
        .league-count { color: #aaa; font-size: 0.7rem; }
        .league-matches { padding: 10px; display: block; }
        .league-matches.collapsed { display: none; }
        .match-card { background: #0a1a1a; border-radius: 16px; padding: 12px; margin-bottom: 10px; border: 1px solid #FFD70030; }
        .match-header { display: flex; justify-content: space-between; margin-bottom: 10px; color: #FFD700; font-size: 0.7rem; }
        .match-status { background: #ff4444; padding: 2px 8px; border-radius: 20px; font-size: 0.6rem; color: white; }
        .match-status.upcoming { background: #FFA500; }
        .match-teams { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
        .match-team { flex: 1; text-align: center; }
        .match-team-name { font-weight: bold; color: #FFFFFF; font-size: 0.85rem; }
        .match-score { font-size: 1.2rem; font-weight: bold; color: #00FF88; margin-top: 4px; }
        .match-vs { color: #FFD700; font-size: 0.7rem; }
        .market-title { font-size: 0.65rem; color: #FFA500; margin: 8px 0 5px; padding-left: 5px; }
        .bet-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .bet-btn { flex: 1; min-width: 80px; background: rgba(0,0,0,0.5); border: 1px solid #FFD70040; border-radius: 12px; padding: 8px 4px; text-align: center; cursor: pointer; }
        .bet-btn:active { background: #FFD700; transform: scale(0.97); }
        .bet-label { font-size: 0.6rem; color: #FFD700; }
        .bet-value { font-size: 0.9rem; font-weight: bold; color: #00FF88; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0a1a1a; border-top: 2px solid #FFD700; padding: 12px; display: flex; gap: 10px; z-index: 1000; }
        .bottom-btn { flex: 1; background: #1a2a2a; border: 1px solid #FFD700; padding: 12px; border-radius: 50px; font-weight: bold; cursor: pointer; color: #FFD700; text-align: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #1a2a2a; border-radius: 28px; padding: 20px; width: 90%; max-width: 400px; border: 2px solid #FFD700; }
        .modal-title { color: #FFD700; font-size: 1.2rem; text-align: center; margin-bottom: 15px; }
        .api-status { background: #1a2a2a; padding: 8px; border-radius: 20px; margin-bottom: 15px; text-align: center; font-size: 0.7rem; color: #00FF88; }
        .input-field { width: 100%; padding: 10px; margin: 8px 0; background: #0a1a1a; border: 1px solid #FFD700; border-radius: 30px; color: white; }
        .btn-primary { width: 100%; padding: 10px; background: #FFD700; border: none; border-radius: 30px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        @media (max-width: 700px) { .match-teams { flex-direction: column; gap: 5px; } .match-vs { display: none; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>⚡ SOCCER BET</h1><div style="font-size:0.55rem;">1X2 • Asian Handicap • Over/Under</div></div>
        <div id="authSection"><div class="user-menu"><button class="menu-btn" id="showLoginBtn">Login</button><button class="menu-btn" id="showSignupBtn">Sign Up</button></div></div>
        <div id="userSection" style="display:none;"><div class="user-menu"><span class="username" id="usernameDisplay"></span><span class="balance-value" id="balanceDisplay">0</span><button class="menu-btn" id="depositBtn">💰</button><button class="menu-btn" id="withdrawBtn">💸</button><button class="menu-btn" id="logoutBtn">Exit</button></div></div>
    </div>

    <div id="apiStatus" class="api-status">🔄 Loading matches...</div>

    <div class="bet-mode-tabs">
        <button class="mode-tab active" data-mode="single">🎯 SINGLE BET</button>
        <button class="mode-tab" data-mode="parlay">📊 PARLAY</button>
    </div>

    <div class="sport-tabs">
        <button class="sport-tab active" data-tab="live">🔴 LIVE</button>
        <button class="sport-tab" data-tab="today">📅 TODAY</button>
    </div>

    <div id="matchesContainer"><div style="text-align:center; padding:40px;">Loading matches...</div></div>

    <div class="bottom-bar">
        <button class="bottom-btn" id="viewSlipBtn">📋 SLIP (<span id="slipCount">0</span>)</button>
        <button class="bottom-btn" id="viewHistoryBtn">📜 HISTORY</button>
    </div>
</div>

<!-- MODALS -->
<div id="slipModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">📋 BET SLIP</div><div id="slipItemsList"></div><div style="margin:10px 0; padding:10px; background:#0a1a1a; border-radius:16px;"><div>Parlay Odds: <span id="totalOddsValue">0x</span></div><div>Stake: <input type="number" id="betStakeInput" value="10" min="5" style="width:100px; background:#0a1a1a; border:1px solid #FFD700; border-radius:20px; padding:5px; color:#00FF88;"></div><div>Potential Win: <span id="totalWinValue">0</span> USDT</div></div><button id="confirmBetBtn" class="btn-primary">CONFIRM</button><button id="clearSlipBtn" class="btn-primary" style="background:#2a2a2a;">Clear</button><button class="btn-primary" onclick="closeSlipModal()">Close</button></div></div>
<div id="receiptModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">🎉 BET RECEIPT</div><div id="receiptContent"></div><button class="btn-primary" onclick="closeReceiptModal()">Close</button></div></div>
<div id="historyModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">📜 HISTORY</div><div id="historyList"></div><button class="btn-primary" onclick="closeHistoryModal()">Close</button></div></div>
<div id="authModal" class="modal-overlay"><div class="modal-content"><h2 id="authTitle" style="color:#FFD700;">Login</h2><div id="loginFields"><input type="email" id="loginEmail" class="input-field" placeholder="Email"><input type="password" id="loginPassword" class="input-field" placeholder="Password"><button id="doLoginBtn" class="btn-primary">Login</button></div><div id="signupFields" style="display:none;"><input type="text" id="signupUsername" class="input-field" placeholder="Username"><input type="email" id="signupEmail" class="input-field" placeholder="Email"><input type="password" id="signupPassword" class="input-field" placeholder="Password"><input type="password" id="signupConfirmPassword" class="input-field" placeholder="Confirm Password"><input type="text" id="signupReferral" class="input-field" placeholder="Referral Code"><button id="doSignupBtn" class="btn-primary">Sign Up</button></div><button id="switchAuthModeBtn" class="btn-primary" style="background:transparent; border:1px solid #FFD700;">Switch</button><button class="btn-primary" onclick="closeAuthModal()">Close</button></div></div>
<div id="depositModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">Deposit USDT</div><div id="qrCode" style="margin:15px 0;"></div><div style="background:#0a1a1a; padding:10px; border-radius:16px; color:#FFD700;">TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg</div><button id="copyDepositBtn" class="btn-primary">Copy</button><button class="btn-primary" onclick="closeDepositModal()">Close</button></div></div>
<div id="withdrawModal" class="modal-overlay"><div class="modal-content"><div class="modal-title">Withdraw</div><input type="text" id="withdrawAddress" class="input-field" placeholder="TRC-20 Address"><input type="number" id="withdrawAmount" class="input-field" placeholder="Amount (USDT)" min="10"><div id="withdrawMsg"></div><button id="submitWithdrawBtn" class="btn-primary">Submit</button><button class="btn-primary" onclick="closeWithdrawModal()">Close</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
let token = localStorage.getItem('authToken');
let currentUserId = null, currentBalance = 0, currentUsername = "";
let betMode = "single";
let singleBet = null;
let parlayBets = [];
let currentTab = "live";
let liveMatches = [];
let upcomingMatches = [];
let userBets = [];

const balanceDisplay = document.getElementById('balanceDisplay');
const usernameDisplay = document.getElementById('usernameDisplay');
const matchesContainer = document.getElementById('matchesContainer');
const apiStatus = document.getElementById('apiStatus');
const slipCount = document.getElementById('slipCount');

async function checkSession() {
    if (!token) return false;
    try {
        const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
            const user = await res.json();
            currentUserId = user.id;
            currentBalance = user.balance;
            currentUsername = user.username;
            balanceDisplay.innerText = currentBalance.toLocaleString() + " USDT";
            usernameDisplay.innerText = currentUsername;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('userSection').style.display = 'flex';
            fetchLiveMatches();
            fetchUserBets();
            return true;
        } else { localStorage.removeItem('authToken'); token = null; return false; }
    } catch(e) { return false; }
}

async function login(email, password) {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (data.success) {
        token = data.token; localStorage.setItem('authToken', token);
        currentUserId = data.user.id; currentBalance = data.user.balance; currentUsername = data.user.username;
        balanceDisplay.innerText = currentBalance.toLocaleString() + " USDT";
        usernameDisplay.innerText = currentUsername;
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('userSection').style.display = 'flex';
        closeAuthModal(); fetchLiveMatches(); fetchUserBets();
    } else { alert(data.error); }
}

async function signup(username, email, password, confirm, referral) {
    if (password !== confirm) { alert("Passwords do not match"); return; }
    const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password, confirmPassword: confirm, referralCode: referral }) });
    const data = await res.json();
    if (data.success) { alert('Account created! Please login.'); switchToLogin(); }
    else { alert(data.error); }
}

function logout() {
    localStorage.removeItem('authToken'); token = null; currentUserId = null;
    singleBet = null; parlayBets = []; updateSlipCount();
    document.getElementById('authSection').style.display = 'flex';
    document.getElementById('userSection').style.display = 'none';
    matchesContainer.innerHTML = '<div style="text-align:center; padding:40px;">🔐 Please login</div>';
}
function updateSlipCount() { slipCount.innerText = betMode === "single" ? (singleBet ? 1 : 0) : parlayBets.length; }

async function fetchLiveMatches() {
    if (!currentUserId) return;
    apiStatus.innerHTML = "🔄 Fetching live matches...";
    try {
        const res = await fetch('/api/live-scores');
        const data = await res.json();
        if (data && data.length > 0) {
            liveMatches = data;
            apiStatus.innerHTML = `✅ ${liveMatches.length} live matches`;
        } else {
            liveMatches = [];
            apiStatus.innerHTML = "⚠️ No live matches";
        }
        if (currentTab === 'live') renderLiveMatches();
        else fetchUpcomingMatches();
    } catch(e) { apiStatus.innerHTML = "❌ Error loading matches"; }
}

async function fetchUpcomingMatches() {
    if (!currentUserId) return;
    apiStatus.innerHTML = "🔄 Fetching upcoming matches...";
    try {
        const res = await fetch('/api/upcoming-matches');
        const data = await res.json();
        if (data && data.length > 0) {
            upcomingMatches = data;
            apiStatus.innerHTML = `✅ ${upcomingMatches.length} upcoming matches`;
        } else {
            upcomingMatches = [];
            apiStatus.innerHTML = "⚠️ No upcoming matches";
        }
        if (currentTab === 'today') renderUpcomingMatches();
    } catch(e) { apiStatus.innerHTML = "❌ Error loading upcoming matches"; }
}

async function fetchOddsForMatch(matchId) {
    try {
        const res = await fetch(`/api/match-odds/${matchId}?companyId=31`);
        const data = await res.json();
        if (data && data.data && data.data[0]) {
            return data.data[0];
        }
        return null;
    } catch(e) { return null; }
}

function renderLiveMatches() {
    if (liveMatches.length === 0) {
        matchesContainer.innerHTML = '<div style="text-align:center; padding:40px;">⚽ No live matches right now</div>';
        return;
    }
    const leagues = {};
    liveMatches.forEach(m => { const league = m.leagueName || "Football"; if (!leagues[league]) leagues[league] = []; leagues[league].push(m); });
    matchesContainer.innerHTML = Object.keys(leagues).map(league => `
        <div class="league-group">
            <div class="league-header" data-league="${league.replace(/ /g, '_')}">
                <span class="league-name">🏆 ${league}</span>
                <span class="league-count">${leagues[league].length} matches</span>
            </div>
            <div class="league-matches" id="league_${league.replace(/ /g, '_')}">
                ${leagues[league].map(m => `
                    <div class="match-card" data-id="${m.matchId}">
                        <div class="match-header"><span class="match-status live">🔴 LIVE</span><span>${new Date(m.matchTime * 1000).toLocaleTimeString()}</span></div>
                        <div class="match-teams">
                            <div class="match-team"><div class="match-team-name">${escapeHtml(m.homeName)}</div><div class="match-score">${m.homeScore}</div></div>
                            <div class="match-vs">VS</div>
                            <div class="match-team"><div class="match-team-name">${escapeHtml(m.awayName)}</div><div class="match-score">${m.awayScore}</div></div>
                        </div>
                        <div class="market-title">⚡ 1X2 (Moneyline)</div>
                        <div class="bet-row">
                            <div class="bet-btn" data-match="${m.matchId}" data-selection="home" data-odds="2.00" data-name="${escapeHtml(m.homeName)}" data-home="${escapeHtml(m.homeName)}" data-away="${escapeHtml(m.awayName)}"><div class="bet-label">HOME</div><div class="bet-value odds-home">2.00</div></div>
                            <div class="bet-btn" data-match="${m.matchId}" data-selection="draw" data-odds="3.20" data-name="Draw" data-home="${escapeHtml(m.homeName)}" data-away="${escapeHtml(m.awayName)}"><div class="bet-label">DRAW</div><div class="bet-value odds-draw">3.20</div></div>
                            <div class="bet-btn" data-match="${m.matchId}" data-selection="away" data-odds="3.50" data-name="${escapeHtml(m.awayName)}" data-home="${escapeHtml(m.homeName)}" data-away="${escapeHtml(m.awayName)}"><div class="bet-label">AWAY</div><div class="bet-value odds-away">3.50</div></div>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `).join('');
    attachClickHandlers();
    fetchAllOdds();
}

function renderUpcomingMatches() {
    if (upcomingMatches.length === 0) {
        matchesContainer.innerHTML = '<div style="text-align:center; padding:40px;">⚽ No upcoming matches today</div>';
        return;
    }
    const leagues = {};
    upcomingMatches.forEach(m => { const league = m.league_name || "Football"; if (!leagues[league]) leagues[league] = []; leagues[league].push(m); });
    matchesContainer.innerHTML = Object.keys(leagues).map(league => `
        <div class="league-group">
            <div class="league-header" data-league="${league.replace(/ /g, '_')}">
                <span class="league-name">🏆 ${league}</span>
                <span class="league-count">${leagues[league].length} matches</span>
            </div>
            <div class="league-matches" id="league_${league.replace(/ /g, '_')}">
                ${leagues[league].map(m => `
                    <div class="match-card" data-id="${m.fixture_id}">
                        <div class="match-header"><span class="match-status upcoming">📅 UPCOMING</span><span>${new Date(m.event_date).toLocaleTimeString()}</span></div>
                        <div class="match-teams">
                            <div class="match-team"><div class="match-team-name">${escapeHtml(m.home_team)}</div><div class="match-score">-</div></div>
                            <div class="match-vs">VS</div>
                            <div class="match-team"><div class="match-team-name">${escapeHtml(m.away_team)}</div><div class="match-score">-</div></div>
                        </div>
                        <div class="market-title">⚡ 1X2 (Moneyline)</div>
                        <div class="bet-row">
                            <div class="bet-btn" data-match="${m.fixture_id}" data-selection="home" data-odds="2.00" data-name="${escapeHtml(m.home_team)}" data-home="${escapeHtml(m.home_team)}" data-away="${escapeHtml(m.away_team)}"><div class="bet-label">HOME</div><div class="bet-value odds-home">2.00</div></div>
                            <div class="bet-btn" data-match="${m.fixture_id}" data-selection="draw" data-odds="3.20" data-name="Draw" data-home="${escapeHtml(m.home_team)}" data-away="${escapeHtml(m.away_team)}"><div class="bet-label">DRAW</div><div class="bet-value odds-draw">3.20</div></div>
                            <div class="bet-btn" data-match="${m.fixture_id}" data-selection="away" data-odds="3.50" data-name="${escapeHtml(m.away_team)}" data-home="${escapeHtml(m.home_team)}" data-away="${escapeHtml(m.away_team)}"><div class="bet-label">AWAY</div><div class="bet-value odds-away">3.50</div></div>
                        </div>
                        <div class="market-title">⚽ Asian Handicap</div>
                        <div class="bet-row" id="handicap-row-${m.fixture_id}">
                            <div class="bet-btn" style="flex:1"><div class="bet-label">Loading...</div></div>
                        </div>
                        <div class="market-title">📊 Over/Under</div>
                        <div class="bet-row" id="overunder-row-${m.fixture_id}">
                            <div class="bet-btn" style="flex:1"><div class="bet-label">Loading...</div></div>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `).join('');
    attachClickHandlers();
    fetchAllOdds();
}

async function fetchAllOdds() {
    const matchCards = document.querySelectorAll('.match-card');
    for (const card of matchCards) {
        const matchId = card.dataset.id;
        if (matchId) {
            const odds = await fetchOddsForMatch(matchId);
            if (odds) {
                updateMatchOdds(card, odds);
            }
        }
    }
}

function updateMatchOdds(card, odds) {
    const homeOdds = card.querySelector('.odds-home');
    const drawOdds = card.querySelector('.odds-draw');
    const awayOdds = card.querySelector('.odds-away');
    if (homeOdds) homeOdds.innerText = odds.odds_home?.toFixed(2) || '2.00';
    if (drawOdds) drawOdds.innerText = odds.odds_draw?.toFixed(2) || '3.20';
    if (awayOdds) awayOdds.innerText = odds.odds_away?.toFixed(2) || '3.50';
    
    const matchId = card.dataset.id;
    
    // Asian Handicap
    if (odds.asian_handicap && odds.asian_handicap.length > 0) {
        const handicapRow = document.getElementById(`handicap-row-${matchId}`);
        if (handicapRow) {
            handicapRow.innerHTML = odds.asian_handicap.slice(0, 3).map(h => `
                <div class="bet-btn" data-match="${matchId}" data-selection="home_handicap" data-odds="${h.home}" data-handicap="${h.line}">
                    <div class="bet-label">${h.line}</div>
                    <div class="bet-value">${h.home.toFixed(2)}</div>
                </div>
                <div class="bet-btn" data-match="${matchId}" data-selection="away_handicap" data-odds="${h.away}" data-handicap="${h.line}">
                    <div class="bet-label">${h.line}</div>
                    <div class="bet-value">${h.away.toFixed(2)}</div>
                </div>
            `).join('');
        }
    }
    
    // Over/Under
    if (odds.over_under && odds.over_under.length > 0) {
        const overRow = document.getElementById(`overunder-row-${matchId}`);
        if (overRow) {
            overRow.innerHTML = odds.over_under.slice(0, 3).map(ou => `
                <div class="bet-btn" data-match="${matchId}" data-selection="over" data-odds="${ou.over}">
                    <div class="bet-label">Over ${ou.line}</div>
                    <div class="bet-value">${ou.over.toFixed(2)}</div>
                </div>
                <div class="bet-btn" data-match="${matchId}" data-selection="under" data-odds="${ou.under}">
                    <div class="bet-label">Under ${ou.line}</div>
                    <div class="bet-value">${ou.under.toFixed(2)}</div>
                </div>
            `).join('');
        }
    }
}

function attachClickHandlers() {
    document.querySelectorAll('.league-header').forEach(h => {
        h.addEventListener('click', () => {
            const id = h.dataset.league;
            const div = document.getElementById(`league_${id}`);
            if (div) div.classList.toggle('collapsed');
        });
    });
    document.querySelectorAll('.bet-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const matchName = `${btn.dataset.home} vs ${btn.dataset.away}`;
            let selection = btn.dataset.selection;
            let odds = parseFloat(btn.dataset.odds);
            let displayName = selection;
            if (selection === 'home') displayName = btn.dataset.home;
            if (selection === 'away') displayName = btn.dataset.away;
            if (selection === 'draw') displayName = 'Draw';
            if (selection === 'home_handicap') displayName = `${btn.dataset.home} ${btn.dataset.handicap}`;
            if (selection === 'away_handicap') displayName = `${btn.dataset.away} ${btn.dataset.handicap}`;
            if (selection === 'over') displayName = `Over ${btn.dataset.line || ''}`;
            if (selection === 'under') displayName = `Under ${btn.dataset.line || ''}`;
            selectBet(matchName, displayName, odds);
        });
    });
}

function selectBet(matchName, selection, odds) {
    if (betMode === "single") {
        singleBet = { matchName, selection, odds };
        updateSlipCount();
    } else {
        const exists = parlayBets.some(b => b.matchName === matchName && b.selection === selection);
        if (exists) parlayBets = parlayBets.filter(b => !(b.matchName === matchName && b.selection === selection));
        else parlayBets.push({ matchName, selection, odds });
        updateSlipCount();
    }
}

function openSlipModal() {
    const container = document.getElementById('slipItemsList');
    let bets = betMode === "single" ? (singleBet ? [singleBet] : []) : parlayBets;
    if (bets.length === 0) { alert("No bets selected"); return; }
    container.innerHTML = bets.map(b => `<div style="background:#0a1a1a; border-radius:12px; padding:10px; margin-bottom:8px;"><div>${escapeHtml(b.matchName)}</div><div style="color:#FFD700;">${escapeHtml(b.selection)} @ ${b.odds.toFixed(2)}x</div></div>`).join('');
    const totalOdds = bets.reduce((t, b) => t * b.odds, 1);
    document.getElementById('totalOddsValue').innerText = totalOdds.toFixed(2) + 'x';
    const stake = parseFloat(document.getElementById('betStakeInput').value) || 10;
    document.getElementById('totalWinValue').innerText = (stake * totalOdds).toFixed(2);
    document.getElementById('betStakeInput').oninput = () => { let s = parseFloat(document.getElementById('betStakeInput').value) || 10; document.getElementById('totalWinValue').innerText = (s * totalOdds).toFixed(2); };
    document.getElementById('slipModal').style.display = 'flex';
}

async function placeBet() {
    let bets = betMode === "single" ? (singleBet ? [singleBet] : []) : parlayBets;
    if (bets.length === 0) { alert("No bets selected"); return; }
    const stake = parseFloat(document.getElementById('betStakeInput').value) || 10;
    if (stake > currentBalance) { alert("Insufficient balance"); return; }
    const totalOdds = bets.reduce((t, b) => t * b.odds, 1);
    const res = await fetch('/api/place-bet', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ bets, totalStake: stake, totalOdds }) });
    const data = await res.json();
    if (data.success) {
        currentBalance = data.newBalance;
        balanceDisplay.innerText = currentBalance.toLocaleString() + " USDT";
        alert(`Bet placed! Stake: ${stake} USDT | Odds: ${totalOdds.toFixed(2)}x`);
        singleBet = null; parlayBets = []; updateSlipCount(); closeSlipModal(); fetchUserBets();
    } else { alert(data.error); }
}

async function fetchUserBets() {
    if (!token) return;
    const res = await fetch('/api/user-bets', { headers: { 'Authorization': `Bearer ${token}` } });
    const bets = await res.json();
    userBets = bets;
    if (bets.length) {
        document.getElementById('historyList').innerHTML = bets.slice().reverse().map(b => `<div style="background:#0a1a1a; border-radius:12px; padding:10px; margin-bottom:8px;"><div>${new Date(b.timestamp).toLocaleString()}</div><div>Stake: ${b.totalStake} USDT | Odds: ${b.totalOdds.toFixed(2)}x</div><div style="color:#FFA500;">Status: ${b.status || 'Pending'}</div></div>`).join('');
    } else {
        document.getElementById('historyList').innerHTML = '<div style="text-align:center;">No bets yet</div>';
    }
}

function showHistory() { fetchUserBets(); document.getElementById('historyModal').style.display = 'flex'; }
function closeSlipModal() { document.getElementById('slipModal').style.display = 'none'; }
function closeReceiptModal() { document.getElementById('receiptModal').style.display = 'none'; }
function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }
function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
function closeDepositModal() { document.getElementById('depositModal').style.display = 'none'; }
function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }

document.getElementById('viewSlipBtn')?.addEventListener('click', openSlipModal);
document.getElementById('viewHistoryBtn')?.addEventListener('click', showHistory);
document.getElementById('confirmBetBtn')?.addEventListener('click', placeBet);
document.getElementById('clearSlipBtn')?.addEventListener('click', () => { singleBet = null; parlayBets = []; updateSlipCount(); });
document.querySelectorAll('.mode-tab').forEach(tab => tab.addEventListener('click', () => {
    betMode = tab.dataset.mode;
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    singleBet = null; parlayBets = []; updateSlipCount();
}));
document.querySelectorAll('.sport-tab').forEach(tab => tab.addEventListener('click', () => {
    currentTab = tab.dataset.tab;
    document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    if (currentTab === 'live') renderLiveMatches();
    else fetchUpcomingMatches();
}));
document.getElementById('showLoginBtn')?.addEventListener('click', () => { switchToLogin(); document.getElementById('authModal').style.display = 'flex'; });
document.getElementById('showSignupBtn')?.addEventListener('click', () => { switchToSignup(); document.getElementById('authModal').style.display = 'flex'; });
document.getElementById('doLoginBtn')?.addEventListener('click', () => login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value));
document.getElementById('doSignupBtn')?.addEventListener('click', () => signup(document.getElementById('signupUsername').value, document.getElementById('signupEmail').value, document.getElementById('signupPassword').value, document.getElementById('signupConfirmPassword').value, document.getElementById('signupReferral').value));
document.getElementById('switchAuthModeBtn')?.addEventListener('click', () => { if(document.getElementById('loginFields').style.display !== 'none') switchToSignup(); else switchToLogin(); });
document.getElementById('depositBtn')?.addEventListener('click', () => { document.getElementById('depositModal').style.display = 'flex'; setTimeout(() => { if(typeof QRCode !== 'undefined') { document.getElementById('qrCode').innerHTML = ''; new QRCode(document.getElementById('qrCode'), { text: 'TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg', width: 180, height: 180 }); } }, 100); });
document.getElementById('copyDepositBtn')?.addEventListener('click', () => { navigator.clipboard.writeText('TJBMedguebbWDtbVR9tYjBg3kb6NjMZWwg'); alert('Copied!'); });
document.getElementById('withdrawBtn')?.addEventListener('click', () => document.getElementById('withdrawModal').style.display = 'flex');
document.getElementById('submitWithdrawBtn')?.addEventListener('click', async () => {
    const addr = document.getElementById('withdrawAddress').value;
    const amt = parseFloat(document.getElementById('withdrawAmount').value);
    if(!addr || amt<10) { document.getElementById('withdrawMsg').innerText = 'Invalid'; return; }
    const res = await fetch('/api/withdraw-request', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ amount: amt, walletAddress: addr }) });
    const data = await res.json();
    if(data.success) { alert('Request submitted'); closeWithdrawModal(); }
    else alert(data.error);
});
document.getElementById('logoutBtn')?.addEventListener('click', logout);
let isLoginMode = true;
function switchToLogin() { isLoginMode = true; document.getElementById('authTitle').innerText = 'Login'; document.getElementById('loginFields').style.display = 'block'; document.getElementById('signupFields').style.display = 'none'; }
function switchToSignup() { isLoginMode = false; document.getElementById('authTitle').innerText = 'Sign Up'; document.getElementById('loginFields').style.display = 'none'; document.getElementById('signupFields').style.display = 'block'; }
function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;':(m==='<'?'&lt;':'&gt;')); }

window.closeSlipModal = closeSlipModal; window.closeReceiptModal = closeReceiptModal; window.closeHistoryModal = closeHistoryModal; window.closeAuthModal = closeAuthModal; window.closeDepositModal = closeDepositModal; window.closeWithdrawModal = closeWithdrawModal;

checkSession();
</script>
</body>
</html>
