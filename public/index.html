<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>iSPORTS LIVE | Real Scores & Odds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a1f1c 0%, #0b2b25 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #ffd70040;
        }

        .logo h1 {
            background: linear-gradient(135deg, #ffe1a0, #f3b33d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.5rem;
        }

        .balance-card {
            background: #0f2a24;
            padding: 8px 24px;
            border-radius: 60px;
            border: 1px solid #ffd700;
            text-align: center;
        }

        .balance-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd700;
        }

        .api-status {
            background: #1a1a2e;
            padding: 10px 20px;
            border-radius: 40px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.8rem;
        }

        .api-status.success {
            background: #0a3a2a;
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .api-status.error {
            background: #3a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
        }

        .api-status.loading {
            background: #2a2a1a;
            color: #ffd700;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .match-card {
            background: #14141f;
            border-radius: 24px;
            padding: 16px;
            border: 1px solid #ffd70040;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #ffd700;
            font-size: 0.7rem;
        }

        .teams {
            text-align: center;
            padding: 15px 0;
        }

        .team {
            font-size: 1rem;
            font-weight: bold;
            color: white;
        }

        .vs {
            color: #ffd700;
            margin: 8px 0;
        }

        .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
            margin: 10px 0;
        }

        .odds-row {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .odd-btn {
            flex: 1;
            background: #0a0a10;
            border-radius: 20px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #2a2a35;
        }

        .odd-btn:hover {
            background: #2a2a35;
            border-color: #ffd700;
        }

        .odd-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
        }

        .bet-slip {
            background: #14141f;
            border-radius: 28px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #ffd70040;
        }

        .slip-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ffd70040;
        }

        .slip-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .clear-btn {
            background: #2a2a2a;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            color: #ddd;
            cursor: pointer;
        }

        .slip-items {
            max-height: 300px;
            overflow-y: auto;
        }

        .slip-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a10;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stake-input {
            width: 80px;
            background: #0a0a10;
            border: 1px solid #ffd700;
            border-radius: 30px;
            padding: 8px;
            text-align: center;
            color: #ffd700;
        }

        .remove-btn {
            background: #3a1a1a;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 16px;
            color: #ff6666;
            cursor: pointer;
        }

        .place-bet-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffd700, #f3a81d);
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #aaa;
        }

        @media (max-width: 700px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1>⚡ iSPORTS LIVE</h1>
            <div style="font-size: 0.65rem;">Real Live Scores • Betting Odds</div>
        </div>
        <div class="balance-card">
            <div class="balance-value" id="balanceDisplay">100000</div>
        </div>
    </div>

    <div id="apiStatus" class="api-status loading">🔄 Connecting to iSports API...</div>

    <div id="matchesContainer" class="matches-grid">
        <div class="loading">📡 Fetching live matches from iSports API...</div>
    </div>

    <div class="bet-slip">
        <div class="slip-header">
            <div class="slip-title">📋 BET SLIP</div>
            <button class="clear-btn" id="clearSlipBtn">Clear</button>
        </div>
        <div id="slipItems" class="slip-items">
            <div style="text-align: center; padding: 20px; color: #aaa;">Tap odds to add bets</div>
        </div>
        <div id="totalDisplay" style="display: none;"></div>
        <button class="place-bet-btn" id="placeBetBtn">✔️ PLACE BETS</button>
    </div>
</div>

<script>
// ============================================================
// CORRECT iSPORTS API ENDPOINT
// Endpoint: /sport/football/livescores
// Your API Key: y6qNrfP7R0qJUh1x
// ============================================================
const ISPORTS_API_KEY = "y6qNrfP7R0qJUh1x";
const API_BASE = "http://api.isportsapi.com";

// App state
let balance = 100000;
let bettingSlip = [];
let realMatches = [];

// DOM elements
const balanceDisplay = document.getElementById('balanceDisplay');
const matchesContainer = document.getElementById('matchesContainer');
const apiStatusDiv = document.getElementById('apiStatus');
const slipItemsDiv = document.getElementById('slipItems');
const totalDisplayDiv = document.getElementById('totalDisplay');

function updateBalanceUI() {
    balanceDisplay.innerText = balance.toLocaleString();
    localStorage.setItem('isports_balance', balance);
}

function loadBalance() {
    const saved = localStorage.getItem('isports_balance');
    if (saved) balance = parseFloat(saved);
    updateBalanceUI();
}

// ============================================================
// FETCH REAL LIVE MATCHES FROM iSPORTS API
// CORRECT ENDPOINT: /sport/football/livescores
// ============================================================
async function fetchLiveMatches() {
    apiStatusDiv.className = "api-status loading";
    apiStatusDiv.innerHTML = "🔄 Fetching live matches from iSports API...";
    matchesContainer.innerHTML = '<div class="loading">📡 Connecting to iSports API...</div>';

    try {
        // CORRECT ENDPOINT from documentation
        const url = `${API_BASE}/sport/football/livescores?api_key=${ISPORTS_API_KEY}`;
        
        console.log("Fetching:", url);
        
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        
        console.log("API Response:", data);

        // Check if data has matches
        if (!data || data.length === 0) {
            apiStatusDiv.className = "api-status error";
            apiStatusDiv.innerHTML = "⚠️ No live matches at the moment. Try again later.";
            matchesContainer.innerHTML = '<div class="loading">⚽ No live matches right now.\n\nLive matches will appear here when games are in progress.</div>';
            return;
        }

        // Process live matches
        realMatches = data.map(match => ({
            id: match.matchId,
            league: match.leagueName || "Football",
            home: match.homeTeamName || "Home Team",
            away: match.awayTeamName || "Away Team",
            homeScore: match.homeScore || 0,
            awayScore: match.awayScore || 0,
            status: match.status || "live",
            odds: {
                home: 2.00,
                draw: 3.20,
                away: 3.50
            }
        }));

        apiStatusDiv.className = "api-status success";
        apiStatusDiv.innerHTML = `✅ Connected to iSports API • ${realMatches.length} live matches`;
        
        renderMatches();

    } catch (error) {
        console.error("iSports API Error:", error);
        apiStatusDiv.className = "api-status error";
        apiStatusDiv.innerHTML = `❌ API Error: ${error.message}`;
        matchesContainer.innerHTML = `<div class="loading">❌ Failed to fetch matches\n\nError: ${error.message}\n\nMake sure you have activated your free trial or subscription.</div>`;
    }
}

function renderMatches() {
    if (realMatches.length === 0) return;
    
    matchesContainer.innerHTML = realMatches.map(match => `
        <div class="match-card">
            <div class="match-header">
                <span>🏆 ${escapeHtml(match.league)}</span>
                <span>🔴 LIVE</span>
            </div>
            <div class="teams">
                <div class="team">${escapeHtml(match.home)}</div>
                <div class="score">${match.homeScore} - ${match.awayScore}</div>
                <div class="team">${escapeHtml(match.away)}</div>
                <div class="vs">VS</div>
            </div>
            <div class="odds-row">
                <div class="odd-btn" data-match='${JSON.stringify({matchName:`${match.home} vs ${match.away}`, selection:match.home, odds:match.odds.home})}'>
                    <div class="odd-price">${match.odds.home.toFixed(2)}</div>
                    <div>HOME</div>
                </div>
                <div class="odd-btn" data-match='${JSON.stringify({matchName:`${match.home} vs ${match.away}`, selection:"Draw", odds:match.odds.draw})}'>
                    <div class="odd-price">${match.odds.draw.toFixed(2)}</div>
                    <div>DRAW</div>
                </div>
                <div class="odd-btn" data-match='${JSON.stringify({matchName:`${match.home} vs ${match.away}`, selection:match.away, odds:match.odds.away})}'>
                    <div class="odd-price">${match.odds.away.toFixed(2)}</div>
                    <div>AWAY</div>
                </div>
            </div>
        </div>
    `).join('');
    
    document.querySelectorAll('.odd-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const data = JSON.parse(btn.dataset.match);
            addToSlip(data);
        });
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function addToSlip(bet) {
    const existingIndex = bettingSlip.findIndex(b => b.matchName === bet.matchName && b.selection === bet.selection);
    if (existingIndex !== -1) {
        bettingSlip[existingIndex].stake += 10;
    } else {
        bettingSlip.push({
            id: Date.now(),
            matchName: bet.matchName,
            selection: bet.selection,
            odds: bet.odds,
            stake: 10
        });
    }
    renderSlip();
}

function renderSlip() {
    if (bettingSlip.length === 0) {
        slipItemsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #aaa;">Tap odds to add bets</div>';
        totalDisplayDiv.style.display = 'none';
        return;
    }
    
    let totalStake = 0;
    let totalOdds = 1;
    
    slipItemsDiv.innerHTML = bettingSlip.map((bet, idx) => {
        totalStake += bet.stake;
        totalOdds *= bet.odds;
        return `
            <div class="slip-item">
                <div style="flex: 2; font-size: 0.8rem;">
                    <strong>${escapeHtml(bet.matchName)}</strong><br>
                    ${escapeHtml(bet.selection)} @ ${bet.odds.toFixed(2)}
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="number" value="${bet.stake}" class="stake-input" data-idx="${idx}" step="5" min="5">
                    <button class="remove-btn" data-idx="${idx}">✖</button>
                </div>
            </div>
        `;
    }).join('');
    
    totalDisplayDiv.style.display = 'block';
    totalDisplayDiv.innerHTML = `
        <div style="background: #0a0a10; border-radius: 16px; padding: 12px; margin-top: 10px;">
            <div>💰 Total Stake: ${totalStake.toFixed(2)} USDT</div>
            <div>📊 Parlay Odds: ${totalOdds.toFixed(2)}x</div>
            <div>🎯 Potential Win: ${(totalStake * totalOdds).toFixed(2)} USDT</div>
        </div>
    `;
    
    document.querySelectorAll('.stake-input').forEach(input => {
        input.addEventListener('change', (e) => {
            const idx = parseInt(input.dataset.idx);
            let newStake = parseFloat(input.value);
            if (isNaN(newStake) || newStake < 5) newStake = 5;
            bettingSlip[idx].stake = newStake;
            renderSlip();
        });
    });
    
    document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const idx = parseInt(btn.dataset.idx);
            bettingSlip.splice(idx, 1);
            renderSlip();
        });
    });
}

function placeBets() {
    if (bettingSlip.length === 0) {
        alert("No bets selected!");
        return;
    }
    
    let totalStake = bettingSlip.reduce((sum, b) => sum + b.stake, 0);
    if (totalStake > balance) {
        alert(`Insufficient balance! Need ${totalStake} USDT, have ${balance.toFixed(2)} USDT`);
        return;
    }
    
    let totalOdds = bettingSlip.reduce((prod, b) => prod * b.odds, 1);
    let potentialWin = totalStake * totalOdds;
    
    balance -= totalStake;
    updateBalanceUI();
    
    alert(`✅ Bets placed!\nStake: ${totalStake.toFixed(2)} USDT\nParlay Odds: ${totalOdds.toFixed(2)}x\nPotential Win: ${potentialWin.toFixed(2)} USDT`);
    
    bettingSlip = [];
    renderSlip();
}

document.getElementById('clearSlipBtn').addEventListener('click', () => {
    bettingSlip = [];
    renderSlip();
});

document.getElementById('placeBetBtn').addEventListener('click', placeBets);

window.simulateDeposit = (amount) => {
    balance += amount;
    updateBalanceUI();
    alert(`+${amount} USDT added! New balance: ${balance.toFixed(2)} USDT`);
};

loadBalance();
fetchLiveMatches();

console.log("✅ iSPORTS API - Correct endpoint: /sport/football/livescores");
console.log("🔑 API Key: y6qNrfP7R0qJUh1x");
</script>
</body>
</html>
